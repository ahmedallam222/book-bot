# ══════════════════════════════════════════════════════════════
# خلاصة الكتب — Docker Compose
# ══════════════════════════════════════════════════════════════

services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bookbot:bookbot_pass@db:5432/bookbot
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    volumes:
      - bot_temp:/app/temp
    ports:
      # SECURITY: تُربَط الواجهة بـ 127.0.0.1 افتراضياً — الـ dashboard
      # يجب أن يكون خلف reverse proxy (Nginx/Caddy) مع HTTPS وBasic Auth.
      # للاستثناء (مثل local dev بدون proxy) اضبط: BOT_PORT_BIND=0.0.0.0
      - "${BOT_PORT_BIND:-127.0.0.1}:5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node dist/index.cjs' >/dev/null && wget -q --spider --timeout=5 https://api.telegram.org"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookbot
      POSTGRES_PASSWORD: bookbot_pass
      POSTGRES_DB: bookbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookbot -d bookbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
    external: true
    name: book-bot_pgdata
  redis_data:
  bot_temp:
