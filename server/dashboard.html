<script>
// ══════════════════════════════════════════════
// CONFIG — يُقرأ تلقائياً من نفس السيرفر
// ══════════════════════════════════════════════
// SECURITY: لا نحتفظ بأي token في الـ source. التوكن يُدخَل عبر شاشة
// تسجيل دخول ويُحفَظ في localStorage، فلا يظهر في View Source.
const TOKEN_KEY = "bookbot_dash_secret";
function getToken(){ try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; } }
function setToken(t){ try { t ? localStorage.setItem(TOKEN_KEY,t) : localStorage.removeItem(TOKEN_KEY); } catch {} }

const API_BASE = "";   // نفس الـ origin دائماً — لا mixed content
const REFRESH  = 30000;

// ══════════════════════════════════════════════
// MOCK DATA
// ══════════════════════════════════════════════
const MOCK = {
  today:{date:new Date().toISOString().slice(0,10),searches:847,downloads:621,success:574,fail:47,cacheHits:198,successRate:"92.4%",cacheRate:"31.9%",avgMs:3840,activeUsers:312},

    {bookName:"مختصر المفيد",userId:"998877665",failReason:"All sources returned 404",createdAt:Date.now()-300000},

};

// ══════════════════════════════════════════════
// API LAYER
// ══════════════════════════════════════════════
let _mock = false;

// onAuthLost: callback that App.tsx registers — fires on 401/403 to redirect to Login
let _onAuthLost = ()=>{};
function setAuthLostHandler(fn){ _onAuthLost = fn || (()=>{}); }

async function apiFetch(path, opts={}) {
  const url = `${API_BASE}/api/admin/${path}`;
  const token = getToken();
  if(!token){ _mock = true; _onAuthLost(); return null; }
  try {
    const r = await fetch(url,{...opts,headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json",...(opts.headers||{})}});
    if(r.status===401 || r.status===403){
      // token خاطئ أو فقد صلاحيته — رجّع للـ login
      setToken("");
      _onAuthLost();
      _mock = true;
      return null;
    }
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    _mock = false;
    return j.data ?? j;
  } catch(e) {
    _mock = true;
    return null;
  }
}
async function apiAct(method,path,body){
  await apiFetch(path,{method,body:body?JSON.stringify(body):undefined});
  return true;
}
function _norm(d){
  if(!d) return d;
  // total: API returns {searches,downloads,users}; UI wants {totalSearches,totalDownloads}
  if(d.total){
    d.total.totalSearches  = d.total.totalSearches  ?? d.total.searches  ?? 0;
    d.total.totalDownloads = d.total.totalDownloads ?? d.total.downloads ?? 0;
  }
  // today: derive missing fields
  if(d.today){
    d.today.success      = d.today.success      ?? d.today.found        ?? 0;
    d.today.fail         = d.today.fail         ?? Math.max(0,(d.today.searches||0)-(d.today.success||0));
    d.today.cacheHits    = d.today.cacheHits    ?? d.today.cache_hits    ?? 0;
    d.today.cacheRate    = d.today.cacheRate    ?? (d.today.searches>0?((d.today.cacheHits/d.today.searches)*100).toFixed(1)+"%":"0%");
    d.today.successRate  = d.today.successRate  ?? (d.today.searches>0?((d.today.success/d.today.searches)*100).toFixed(1)+"%":"0%");
    d.today.activeUsers  = d.today.activeUsers  ?? d.today.users         ?? 0;
    d.today.avgMs        = d.today.avgMs        ?? d.today.avg_ms        ?? 0;
  }
  // weekly: API returns object {date: {...}}; UI wants array [{date,...}]
  if(d.weekly && !Array.isArray(d.weekly)){
    d.weekly = Object.entries(d.weekly).map(([date,v])=>({
      date: date.slice(5),
      searches: v.searches||0,
      downloads: v.downloads||0,
      success: v.found??v.success??0,
      fail: Math.max(0,(v.searches||0)-(v.found??v.success??0)),
      cacheHits: v.cacheHits||v.cache_hits||0,
      activeUsers: v.activeUsers||v.users||0,
      avgMs: v.avgMs||v.avg_ms||0,
    })).sort((a,b)=>a.date.localeCompare(b.date));
  }
  return d;
}
async function loadOv(){
  const d=await apiFetch("overview");
  if(d) return _norm(d);
  return {today:MOCK.today,total:MOCK.total,queue:MOCK.queue,premium:MOCK.premium,
          banned:MOCK.banned,blacklist:MOCK.blacklist,system:MOCK.system,weekly:MOCK.weekly};
}
async function loadBooks()  {
  const r = await apiFetch("stats/top-books?limit=15");
  if(!r) return MOCK.topBooks;
  // API returns [{book,count}]; UI wants [{title,count}]
  return r.map(x=>({title: x.title ?? x.book ?? "—", count: x.count||0}));
}
async function loadSrc()    { return (await apiFetch("stats/sources"))            ?? MOCK.sources; }
async function loadDLQ()    { return (await apiFetch("queue/dlq?limit=30"))        ?? MOCK.dlqJobs; }
async function loadPrem()   { return (await apiFetch("users/premium"))             ?? MOCK.premiumUsers; }
async function loadBanned() { return (await apiFetch("users/banned"))              ?? MOCK.bannedUsers; }
async function loadFunnel() { return (await apiFetch("telemetry/funnel"))           ?? null; }
async function loadTraces() { return (await apiFetch("telemetry/traces?limit=30"))  ?? []; }
// DASH 2.0
async function loadLogs(limit=200,level)  {
  const q = `system/logs?limit=${limit}${level?`&level=${level}`:""}`;
  return (await apiFetch(q)) ?? null;
}
async function loadBackup() { return (await apiFetch("system/backup")) ?? null; }
async function loadCosts()  { return (await apiFetch("system/costs"))  ?? null; }

// ══════════════════════════════════════════════
// CSV Export
// ══════════════════════════════════════════════
function exportCSV(filename, rows, columns){
  if(!rows?.length){alert("لا توجد بيانات للتصدير");return;}
  const header = columns.map(c=>`"${c.label.replace(/"/g,'""')}"`).join(",");
  const body = rows.map(r=>columns.map(c=>{
    let v = typeof c.get==="function" ? c.get(r) : r[c.key];
    if(v==null) v="";
    if(typeof v==="object") v=JSON.stringify(v);
    v=String(v).replace(/"/g,'""');
    return `"${v}"`;
  }).join(",")).join("\n");
  const csv = "\uFEFF"+header+"\n"+body;  // BOM for Excel UTF-8
  const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${filename}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ══════════════════════════════════════════════
// TOKEN SHORTCUTS
// ══════════════════════════════════════════════
const T={
  bg:"#06080e",surface:"#0d121b",card:"#141b27",border:"#1c2536",
  gold:"#e0b04a",goldMid:"#c99835",goldDim:"#8a6a22",
  green:"#3ecf8e",greenDim:"#134e37",red:"#ff6b6b",redDim:"#4a1d1d",
  blue:"#5b9dff",blueDim:"#16325c",purple:"#b794f6",orange:"#f0a04b",

};

// Guard: لو Recharts مش محمّل، نعمل stub فارغ عشان الداشبورد ميكسرش
const _R = (typeof Recharts !== 'undefined') ? Recharts : {};
const CHARTS_OK = typeof Recharts !== 'undefined';
const {
  AreaChart,Area,LineChart,Line,BarChart,Bar,RadialBarChart,RadialBar,
  XAxis,YAxis,CartesianGrid,Tooltip,ResponsiveContainer,Cell
} = _R;
const {useState,useEffect,useCallback,useRef,createElement:h} = React;

// ── ErrorBoundary — يحمي Analytics من crash لو Recharts فشل ──
class ChartErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={err:false};}
  static getDerivedStateFromError(){return{err:true};}
  render(){
    if(this.state.err||!CHARTS_OK) return this.props.fallback||null;
    return this.props.children;
  }
}

// ── SafeChart — wrapper آمن حول أي مكون Recharts ──
const SafeChart=({fallback,children})=>
  h(ChartErrorBoundary,{fallback:fallback||h("div",{style:{color:T.muted,fontSize:12,padding:12}},"⚠️ تعذّر تحميل الرسم البياني")},children);

// ══════════════════════════════════════════════
// ATOMS
// ══════════════════════════════════════════════

const Tag=({children,color=T.gold,size=11})=>

    padding:"2px 9px",borderRadius:20,fontSize:size,fontWeight:600,whiteSpace:"nowrap"}},children);

const HR=()=>h("div",{style:{height:1,margin:"14px 0",background:`linear-gradient(90deg,transparent,${T.border},transparent)`}});

const Dot=({color=T.green,size=8})=>
  h("span",{className:"pulse",style:{display:"inline-block",width:size,height:size,borderRadius:"50%",background:color,marginLeft:5,flexShrink:0}});

function Btn({children,onClick,variant="ghost",size="md",disabled=false}){
  const cls={ghost:"btn btn-ghost",gold:"btn btn-gold",danger:"btn btn-danger",success:"btn btn-success",blue:"btn btn-blue"}[variant]||"btn btn-ghost";
  const sizeCls={sm:"btn-sm",md:"btn-md",lg:"btn-lg"}[size]||"btn-md";
  return h("button",{className:`${cls} ${sizeCls}`,onClick,disabled},children);

function Toast({msg,type="ok",onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3400);return()=>clearTimeout(t);},[]);
  const c=type==="ok"?T.green:type==="warn"?T.orange:T.red;
  return h("div",{className:"toast fade-up",style:{border:`1px solid ${c}55`,color:c,
    boxShadow:`0 12px 40px rgba(0,0,0,.4),0 0 0 1px ${c}15`}},
    type==="ok"?"✅":type==="warn"?"⚠️":"❌"," ",msg);
}

    {icon:"✅",label:"نسبة النجاح",value:`${sr}٪`,color:+sr>=90?T.green:+sr>=70?T.orange:T.red,sub:`${success} نجاح`},
    {icon:"⚡",label:"من الكاش",value:cacheHits.toLocaleString(),color:T.purple,sub:cacheRate},

function SourcesTab({sources}){
  if(!sources?.length) return h(Card,null,h(Sk,{h:200}));
  // DASH 2.0 — derive a tiny synthetic sparkline if the API didn't give one.
  // Shows last 7d trend if `s.history` is provided as [{ok,fail}], else flat bar.
  const trendOf = (s) => {
    if(Array.isArray(s.history)&&s.history.length){
      return s.history.map(h2=>{ const t=(h2.ok||0)+(h2.fail||0); return t>0?(h2.ok/t)*100:0; });
    }
    return null;
  };
  // Sort: best success rate at top
  const sorted = [...sources].sort((a,b)=>{
    const ra = (a.ok+a.fail)>0 ? a.ok/(a.ok+a.fail) : 0;
    const rb = (b.ok+b.fail)>0 ? b.ok/(b.ok+b.fail) : 0;
    return rb-ra;
  });
  return h("div",{className:"fade-up"},
    h(Card,null,
      h(SH,{icon:"🔌",title:`صحة المصادر — ${sources.length} مصدر`,actions:
        h("span",{style:{fontSize:11,color:T.muted}},"مرتّبة حسب النسبة")
      }),
      h("table",null,
        h("thead",null,h("tr",{style:{borderBottom:`2px solid ${T.border}`}},
          ["المصدر","✅ نجاح","❌ فشل","النسبة","الشريط","الاتجاه","الحالة"].map(hd=>
            h("th",{key:hd,style:{color:T.muted,fontWeight:500,fontSize:11,paddingBottom:10}},hd)
          )
        )),
        h("tbody",null,sorted.map((s,i)=>{
          const t=s.ok+s.fail, r=t>0?(s.ok/t)*100:0, c=r>=90?T.green:r>=75?T.orange:T.red;
          const trend = trendOf(s);
          return h("tr",{key:i,style:{borderBottom:`1px solid ${T.border}20`}},
            h("td",{style:{fontWeight:600,maxWidth:280,overflow:"hidden",textOverflow:"ellipsis"}},s.domain),
            h("td",null,h("span",{className:"mono",style:{color:T.green,fontWeight:700}},s.ok)),
            h("td",null,h("span",{className:"mono",style:{color:s.fail>0?T.red:T.muted}},s.fail)),
            h("td",null,h(Tag,{color:c},s.rate)),
            h("td",{style:{width:100}},
              h("div",{style:{background:T.dim,borderRadius:4,height:6,overflow:"hidden"}},
                h("div",{style:{background:c,width:`${r}%`,height:"100%",borderRadius:4}})
              )
            ),
            h("td",{style:{width:80}}, trend ? h(SourceSparkline,{values:trend,color:c,w:64,h:22}) : h("span",{style:{color:T.muted,fontSize:10}},"—")),
            h("td",{style:{fontSize:12}},r>=90?"🟢 ممتاز":r>=75?"🟡 جيد":"🔴 ضعيف")
          );
        }))
      )
    )
  );
}

function BroadcastBox({onToast}){
  const [msg,setMsg]=useState("");
  const [target,setTarget]=useState("all");   // all | premium | active7
  const [busy,setBusy]=useState(false);
  const [stats,setStats]=useState(null);
  const send=async()=>{
    const text=msg.trim();
    if(text.length<3){onToast("الرسالة قصيرة","err");return;}
    if(text.length>4000){onToast("الرسالة طويلة جداً (4000 حرف)","err");return;}
    if(!confirm(`إرسال الرسالة إلى ${target==="all"?"كل المستخدمين":target==="premium"?"المميزين فقط":"المستخدمين النشطين 7 أيام"}؟`))return;
    setBusy(true); setStats(null);
    try{
      const r=await fetch(`${API_BASE}/api/admin/broadcast`,{
        method:"POST",
        headers:{Authorization:`Bearer ${getToken()}`,"Content-Type":"application/json"},
        body:JSON.stringify({message:text,target})
      });
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);
      const d=j.data??j;
      setStats(d);
      onToast(`📢 بدأ الإرسال إلى ${d.total||0} مستخدم`);
      setMsg("");
    }catch(e){onToast(`❌ ${e.message||e}`,"err");}
    finally{setBusy(false);}
  };
  const TargetBtn=({id,label})=>h("button",{onClick:()=>setTarget(id),style:{
    background:target===id?T.goldDim+"40":"transparent",
    border:`1px solid ${target===id?T.gold:T.border}`,
    color:target===id?T.gold:T.muted,
    padding:"6px 14px",borderRadius:8,fontSize:12,fontWeight:target===id?600:400}},label);
  return h(Card,null,
    h(SH,{icon:"📢",title:"إعلان عام للمستخدمين"}),
    h("div",{style:{display:"flex",flexDirection:"column",gap:12}},
      h("div",null,
        h("div",{style:{fontSize:11,color:T.muted,marginBottom:6}},"الفئة المستهدفة"),
        h("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
          h(TargetBtn,{id:"all",label:"👥 الكل"}),
          h(TargetBtn,{id:"premium",label:"⭐ المميزون"}),
          h(TargetBtn,{id:"active7",label:"🕐 النشطون (7ي)"})
        )
      ),
      h("textarea",{value:msg,onChange:e=>setMsg(e.target.value),
        placeholder:"اكتب الإعلان هنا… (يدعم HTML بسيط: <b>عريض</b> <i>مائل</i> <a href=\"...\">رابط</a>)",
        rows:5,maxLength:4000,
        style:{direction:"rtl",resize:"vertical",minHeight:120,fontSize:13,lineHeight:1.6}}),
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:11,color:T.muted}},
        h("span",null,`${msg.length}/4000 حرف`),
        h("span",null,"⚠️ الإرسال يحترم الـ rate-limit وقد يستغرق دقائق")
      ),
      h("div",{style:{display:"flex",gap:8}},
        h(Btn,{variant:"gold",onClick:send,disabled:busy},busy?"… جاري الإرسال":"📤 إرسال الآن"),
        h(Btn,{variant:"ghost",onClick:()=>{setMsg("");setStats(null);}},"🔄 إعادة")
      ),
      stats&&h("div",{style:{marginTop:8,padding:"10px 14px",background:T.greenDim+"30",
        border:`1px solid ${T.green}`,borderRadius:8,fontSize:12,color:T.green,lineHeight:1.7}},
        `✅ تم وضع الإعلان في طابور الإرسال`,
        h("br"),
        `الفئة: ${stats.target==="all"?"الكل":stats.target==="premium"?"المميزون":"النشطون"} — إجمالي مقدّر: ${stats.total||0} مستخدم`,
        h("br"),
        h("span",{style:{fontSize:11,color:T.muted}},"تابع تقدّم الإرسال من الـ logs على السيرفر"))
    )
  );
}

function Metric({label,value,sub,color}){

function FunnelBar({label,value,max,color}){
  const pct=max>0?Math.round((value/max)*100):0;
  return h("div",{style:{marginBottom:10}},
    h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:4}},
      h("span",{style:{fontSize:12,color:T.text}},label),

    h("div",{style:{height:8,background:T.border,borderRadius:4,overflow:"hidden"}},
      h("div",{style:{height:"100%",width:`${pct}%`,background:color||T.gold,borderRadius:4,transition:"width .4s"}})
    )

}

function OutcomeBadge({outcome}){
  const cfg={
    sent_direct:  {bg:"#22c55e22",color:"#22c55e",label:"✅ أُرسل مباشر"},

    error:        {bg:"#ef444422",color:"#ef4444",label:"💥 خطأ"},

  return h("span",{style:{

function PhaseLine({phase,i}){
  const icons={"request_started":"🚀","search_done":"🔍","verify_done":"🔎",
    "download_started":"📥","download_done":"✅","request_done":"🏁"};
  const icon=icons[phase.name]||"•";
  const dataStr=phase.data?Object.entries(phase.data)
    .filter(([k])=>k!=="ms")
    .map(([k,v])=>`${k}: ${JSON.stringify(v)}`).join("  "):"";
  const ms=phase.data?.ms!=null?` +${phase.data.ms}ms`:"";
  return h("div",{style:{
    display:"flex",alignItems:"flex-start",gap:10,padding:"6px 0",
    borderBottom:i>0?`1px solid ${T.border}22`:"none",
  }},
    h("span",{style:{width:24,flexShrink:0,textAlign:"center"}},icon),
    h("div",{style:{flex:1,minWidth:0}},
      h("span",{style:{fontSize:12,fontWeight:600,color:T.text}},phase.name),
      ms&&h("span",{style:{fontSize:10,color:T.muted,marginRight:6}},ms),
      dataStr&&h("div",{style:{fontSize:10,color:T.muted,marginTop:2,wordBreak:"break-word"}},dataStr)
    )
  );
}

// ── Heatmap (hour × day-of-week) ───────────────────────────────
function Heatmap({data}){
  if(!data) return h(Card,null,h(Sk,{h:240}));
  const days=["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];
  const max=data.max||1;
  const cellColor=(v)=>{
    if(!v) return T.dim;
    const intensity=v/max;
    // gold gradient
    const alpha=Math.max(0.15,intensity);
    return `rgba(212,168,67,${alpha.toFixed(2)})`;
  };
  return h(Card,null,
    h(SH,{icon:"🔥",title:"خريطة النشاط — يوم الأسبوع × ساعة (UTC)"}),
    h("div",{style:{overflowX:"auto"}},
      h("table",{style:{borderSpacing:2,borderCollapse:"separate",fontSize:10}},
        h("thead",null,h("tr",null,
          h("th",{style:{padding:"4px 6px",color:T.muted,fontWeight:500}}," "),
          ...Array.from({length:24},(_,h2)=>h("th",{key:h2,style:{padding:"4px 2px",color:T.muted,fontSize:9,fontWeight:500,textAlign:"center",minWidth:18}},h2))
        )),
        h("tbody",null,days.map((dn,d)=>
          h("tr",{key:d},
            h("td",{style:{padding:"3px 8px",color:T.muted,fontWeight:500,whiteSpace:"nowrap",fontSize:11}},dn),
            ...Array.from({length:24},(_,h2)=>{
              const v=data.matrix?.[d]?.[h2]||0;
              return h("td",{key:h2,title:`${dn} ${h2}:00 → ${v} بحث`,style:{
                background:cellColor(v),width:18,height:22,borderRadius:3,

      h("span",null,"أكثر")
    )
  );
}

// ── Trace Waterfall ───────────────────────────────────────────
// رسم gantt أفقي لمراحل الـ request — أوضح من قائمة نصية. كل bar
// نسبة عرضه = نسبة وقت المرحلة من إجمالي الـ trace.
function TraceWaterfall({trace}){
  if(!trace?.phases?.length) return null;
  const total = trace.totalMs || trace.phases.reduce((s,p)=>s+(p.data?.ms||0),0) || 1;
  const colors = {
    request_started:T.muted, search_done:T.blue, verify_done:T.purple,
    download_started:T.orange, download_done:T.green, request_done:T.gold,
  };
  let acc = 0;
  return h("div",{style:{marginTop:14,display:"flex",flexDirection:"column",gap:4}},
    h("div",{style:{fontSize:11,color:T.muted,marginBottom:4,fontWeight:600}},
      `🌊 المخطط الزمني — ${total}ms إجمالي`),
    trace.phases.map((p,i)=>{
      const ms = p.data?.ms||0;
      const widthPct = Math.max(2,(ms/total)*100);
      const offsetPct = (acc/total)*100;
      acc += ms;
      const c = colors[p.name]||T.gold;
      return h("div",{key:i,style:{display:"flex",alignItems:"center",gap:8,fontSize:11}},
        h("span",{style:{width:130,color:T.text,fontWeight:500,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",flexShrink:0}},p.name),
        h("div",{style:{flex:1,height:18,background:T.surface,borderRadius:3,position:"relative",overflow:"hidden"}},
          h("div",{title:`${ms}ms`,style:{position:"absolute",left:`${offsetPct}%`,top:0,height:"100%",
            width:`${widthPct}%`,background:c,borderRadius:3,transition:"width .3s"}})
        ),
        h("span",{className:"mono",style:{width:60,textAlign:"left",color:c,fontWeight:700,flexShrink:0}},`${ms}ms`)
      );
    })
  );
}

// ── Command Palette (Ctrl+K) ──────────────────────────────────
function CommandPalette({open,onClose,onNavigate,onAction,users,books,traces}){
  const [q,setQ]=useState("");
  const [idx,setIdx]=useState(0);
  const inputRef=useRef(null);
  useEffect(()=>{ if(open){ setQ(""); setIdx(0); setTimeout(()=>inputRef.current?.focus(),50);} },[open]);
  const list = (function(){
    const all = [
      ...["overview:🏠 نظرة عامة","analytics:📊 التحليلات","books:📚 الكتب","failed:❌ فشل البحث",
          "cache:💾 مكتبة الكاش","recent:🕐 آخر الطلبات","sources:🔌 المصادر","queue:🔄 الطابور",
          "users:👥 المستخدمون","system:💻 النظام","telemetry:📡 Telemetry","logs:📜 السجلات"]
        .map(s=>{ const [id,label]=s.split(":"); return {type:"nav",id,label,sub:"الانتقال"};}),
      {type:"action",id:"refresh",label:"🔄 تحديث الآن",sub:"إجراء"},
      {type:"action",id:"help",   label:"❓ عرض المساعدة",sub:"إجراء"},
      ...(users?.users||[]).slice(0,30).map(u=>({type:"user",id:String(u.userId),label:`👤 ${u.userId}${u.username?" (@"+u.username+")":""}`,sub:`${u.searches||0} بحث`})),
      ...(books||[]).slice(0,15).map(b=>({type:"book",id:b.title||b.book,label:`📚 ${(b.title||b.book||"").slice(0,60)}`,sub:`${b.count||0} طلب`})),
      ...(traces||[]).slice(0,10).map(t=>({type:"trace",id:t.id,label:`📡 ${(t.bookName||"").slice(0,50)}`,sub:`#${t.id.slice(0,10)}`})),
    ];
    if(!q.trim()) return all.slice(0,40);
    const qq = q.toLowerCase();
    return all.filter(x=>x.label.toLowerCase().includes(qq)).slice(0,40);
  })();
  const choose = (it)=>{
    if(!it) return;
    if(it.type==="nav")    onNavigate(it.id);
    if(it.type==="action") onAction(it.id);
    if(it.type==="user")   onAction("user:"+it.id);
    if(it.type==="trace")  onAction("trace:"+it.id);
    onClose();
  };
  const onKey = (e)=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); setIdx(i=>Math.min(list.length-1,i+1)); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); setIdx(i=>Math.max(0,i-1)); }
    else if(e.key==="Enter"){ e.preventDefault(); choose(list[idx]); }
    else if(e.key==="Escape"){ onClose(); }
  };
  if(!open) return null;
  return h("div",{onClick:onClose,style:{
    position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:10000,
    display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"10vh 20px 20px"
  }},
    h("div",{onClick:e=>e.stopPropagation(),className:"fade-up",style:{
      background:T.surface,border:`1px solid ${T.border}`,borderRadius:14,
      width:"100%",maxWidth:560,boxShadow:"0 20px 60px rgba(0,0,0,.5)",overflow:"hidden",direction:"rtl"
    }},
      h("div",{style:{display:"flex",alignItems:"center",gap:10,padding:"14px 16px",borderBottom:`1px solid ${T.border}`}},
        h("span",{style:{fontSize:18,color:T.gold}},"⌨"),
        h("input",{ref:inputRef,value:q,onChange:e=>{setQ(e.target.value);setIdx(0);},
          onKeyDown:onKey,placeholder:"ابحث: مستخدم، كتاب، أو إجراء…",
          style:{flex:1,background:"transparent",border:"none",outline:"none",fontSize:14,color:T.text}}),
        h("span",{className:"mono",style:{padding:"3px 8px",background:T.bg,border:`1px solid ${T.border}`,borderRadius:5,fontSize:10,color:T.muted,whiteSpace:"nowrap"}},"Esc للإغلاق")
      ),
      h("div",{style:{maxHeight:"58vh",overflowY:"auto"}},
        list.length===0 && h("div",{style:{padding:"24px 20px",textAlign:"center",color:T.muted,fontSize:13}},"لا نتائج"),
        list.map((it,i)=>h("div",{key:`${it.type}:${it.id}:${i}`,onClick:()=>choose(it),onMouseEnter:()=>setIdx(i),
          style:{display:"flex",alignItems:"center",gap:10,padding:"10px 16px",cursor:"pointer",
            background: i===idx ? T.goldDim+"22" : "transparent",
            borderRight: i===idx ? `2px solid ${T.gold}` : "2px solid transparent"}},
          h("span",{style:{flex:1,fontSize:13,color:i===idx?T.gold:T.text,fontWeight:i===idx?600:400,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},it.label),
          h("span",{style:{fontSize:11,color:T.muted}},it.sub)
        ))
      ),
      h("div",{style:{padding:"8px 16px",borderTop:`1px solid ${T.border}`,fontSize:11,color:T.muted,display:"flex",gap:14}},
        h("span",null,"↑↓ للتنقل"),
        h("span",null,"↵ للاختيار"),
        h("span",null,`${list.length} نتيجة`)
      )
    )
  );
}

// ── Auto-Refresh Control ──────────────────────────────────────
function AutoRefreshControl({intervalMs,setIntervalMs,onRefreshNow,lastTs}){
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    if(!open) return;
    const fn = (e)=>{ if(ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown",fn);
    return ()=>document.removeEventListener("mousedown",fn);
  },[open]);
  const [now,setNow]=useState(Date.now());
  useEffect(()=>{ const t=setInterval(()=>setNow(Date.now()),500); return ()=>clearInterval(t); },[]);
  const elapsed = now - (lastTs||now);
  const remainingMs = intervalMs ? Math.max(0, intervalMs - elapsed) : 0;
  const pct = intervalMs ? Math.max(0, 1 - elapsed/intervalMs) : 0;
  const opts = [
    {ms:0,         label:"إيقاف"},
    {ms:10000,     label:"10 ث"},
    {ms:30000,     label:"30 ث"},
    {ms:60000,     label:"1 د"},
    {ms:5*60*1000, label:"5 د"},
  ];
  const current = opts.find(o=>o.ms===intervalMs)?.label || "30 ث";
  const size = 32, r = 13, c = 2*Math.PI*r;
  return h("div",{ref,style:{position:"relative"}},
    h("button",{onClick:()=>setOpen(o=>!o),title:"التحديث التلقائي",style:{
      background:"transparent",border:`1px solid ${T.border}`,padding:"4px 10px",
      borderRadius:8,cursor:"pointer",display:"flex",alignItems:"center",gap:8,
      color:T.text,fontSize:12,height:34
    }},
      // mini countdown ring
      h("svg",{width:size,height:size,style:{transform:"rotate(-90deg)"}},
        h("circle",{cx:size/2,cy:size/2,r,fill:"none",stroke:T.border,strokeWidth:2}),
        intervalMs>0 && h("circle",{cx:size/2,cy:size/2,r,fill:"none",stroke:T.gold,strokeWidth:2,
          strokeDasharray:c,strokeDashoffset:c*(1-pct),strokeLinecap:"round",style:{transition:"stroke-dashoffset 0.3s linear"}})
      ),
      h("span",null,intervalMs===0?"إيقاف":current),
      h("span",{style:{color:T.muted,fontSize:10}},"▾")
    ),
    open && h("div",{className:"fade-up",style:{
      position:"absolute",top:"calc(100% + 6px)",left:0,zIndex:200,
      background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,
      boxShadow:"0 8px 24px rgba(0,0,0,.4)",minWidth:160,padding:6
    }},
      opts.map(o=>h("button",{key:o.ms,onClick:()=>{setIntervalMs(o.ms);setOpen(false);},style:{
        display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%",
        background: o.ms===intervalMs ? T.goldDim+"30" : "transparent",
        border:"none",color:o.ms===intervalMs?T.gold:T.text,
        padding:"8px 12px",borderRadius:6,cursor:"pointer",fontSize:12,textAlign:"right"
      }}, o.label, o.ms===intervalMs ? h("span",{style:{color:T.gold}},"✓") : null)),
      h("div",{style:{borderTop:`1px solid ${T.border}`,marginTop:4,paddingTop:4}},
        h("button",{onClick:()=>{ onRefreshNow(); setOpen(false); },style:{
          width:"100%",background:T.goldDim+"30",border:`1px solid ${T.goldDim}`,color:T.gold,
          padding:"7px 12px",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:600
        }},"🔄 تحديث الآن")
      )
    )
  );
}

// ── Source Sparkline (mini line chart of last 7d success rate) ──
function SourceSparkline({values=[],color=T.gold,w=64,h:height=22}){
  if(!values.length) return h("div",{style:{width:w,height,color:T.muted,fontSize:10,textAlign:"center"}},"—");
  const max = Math.max(...values, 1);
  const points = values.map((v,i)=>{
    const x = (i/(values.length-1||1)) * w;
    const y = height - (v/max)*height + 1;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return h("svg",{width:w,height,style:{display:"block"}},
    h("polyline",{points,fill:"none",stroke:color,strokeWidth:1.5,strokeLinejoin:"round",strokeLinecap:"round"})
  );
}

  useEffect(()=>{ if(autoScroll && scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; });
  if(!logs) return h(Card,null,h(Sk,{h:300}));
  const filtered = level ? (logs.lines||[]).filter(l=>l.level===level) : (logs.lines||[]);
  const stats = logs.stats||{};
  const counts = (logs.lines||[]).reduce((m,l)=>{ m[l.level]=(m[l.level]||0)+1; return m; },{});
  const colors = {DEBUG:T.muted,INFO:T.blue,WARN:T.orange,ERROR:T.red};
  const Filter = ({lvl})=>h("button",{onClick:()=>setLevel(level===lvl?"":lvl),style:{
    background: level===lvl ? (colors[lvl]||T.gold)+"22" : "transparent",
    border:`1px solid ${level===lvl ? (colors[lvl]||T.gold) : T.border}`,
    color: level===lvl ? (colors[lvl]||T.gold) : T.muted,
    padding:"4px 10px",borderRadius:6,fontSize:11,fontWeight:600,cursor:"pointer"
  }}, lvl, " ", h("span",{style:{color:T.muted,marginRight:4}},`(${counts[lvl]||0})`));
  return h("div",{className:"fade-up"},
    h(Card,null,
      h(SH,{icon:"📜",title:`السجلات الحيّة — ${stats.size||0}/${stats.max||0} سطر في الذاكرة`,actions:[
        h(Btn,{key:"r",onClick:onRefresh,size:"sm"},"🔄 تحديث"),
      ]}),
      h("div",{style:{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap",alignItems:"center"}},
        h("span",{style:{fontSize:11,color:T.muted,marginLeft:4}},"تصفية:"),
        h(Filter,{lvl:"DEBUG"}),
        h(Filter,{lvl:"INFO"}),
        h(Filter,{lvl:"WARN"}),
        h(Filter,{lvl:"ERROR"}),
        h("label",{style:{display:"flex",alignItems:"center",gap:5,fontSize:11,color:T.muted,cursor:"pointer",marginRight:"auto"}},
          h("input",{type:"checkbox",checked:autoScroll,onChange:e=>setAutoScroll(e.target.checked),style:{width:14}})," تمرير تلقائي"
        ),
        h(Btn,{onClick:()=>{
          const text = filtered.map(l=>{
            const ts = new Date(l.ts).toISOString();
            return `[${ts}] [${l.level}] [${l.ns}] ${l.msg}${l.meta?" "+JSON.stringify(l.meta):""}`;
          }).join("\n");
          const blob = new Blob([text],{type:"text/plain"});
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `bot-logs-${new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")}.log`;
          a.click();
          URL.revokeObjectURL(a.href);
        },size:"sm"},"⬇ تنزيل")
      ),
      h("div",{ref:scrollRef,style:{
        background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,
        padding:"8px 10px",height:"60vh",overflowY:"auto",
        fontFamily:"'IBM Plex Mono',monospace",fontSize:11,direction:"ltr"
      }},
        filtered.length===0 && h("div",{style:{color:T.muted,padding:"20px 0",textAlign:"center"}},"لا سطور تطابق الفلتر"),
        filtered.map((l,i)=>{
          const ts = new Date(l.ts).toISOString().slice(11,23);
          const c = colors[l.level]||T.text;
          return h("div",{key:i,style:{padding:"2px 0",lineHeight:1.45,whiteSpace:"pre-wrap",wordBreak:"break-word",borderBottom:i<filtered.length-1?`1px solid ${T.border}33`:"none"}},
            h("span",{style:{color:T.muted}},ts," "),
            h("span",{style:{color:c,fontWeight:700,minWidth:48,display:"inline-block"}},`[${l.level}]`),
            h("span",{style:{color:T.purple}},` [${l.ns}]`),
            h("span",{style:{color:T.text}},` ${l.msg}`),
            l.meta && h("span",{style:{color:T.muted}},` ${JSON.stringify(l.meta)}`)
          );
        })
      )
    )
  );
}

// ── Topbar Theme/Density toggle (visual density) ──────────────
function DensityToggle({dense,setDense}){
  return h("button",{onClick:()=>setDense(!dense),title:dense?"كثافة عالية":"كثافة عادية",
    style:{background:"transparent",border:`1px solid ${T.border}`,color:T.muted,
      width:34,height:34,borderRadius:8,cursor:"pointer",fontSize:14}},dense?"▤":"▥");
}

function App({onLogout}){
  const [tab,setTab]=useState("overview");
  // mobile detection — react to viewport changes
  const [isMobile,setIsMobile]=useState(()=>typeof window!=="undefined"&&window.matchMedia?.("(max-width:768px)").matches);
  useEffect(()=>{
    if(typeof window==="undefined") return;
    const mq=window.matchMedia("(max-width:768px)");
    const fn=e=>setIsMobile(e.matches);
    mq.addEventListener?.("change",fn) || mq.addListener?.(fn);
    return()=>{ mq.removeEventListener?.("change",fn) || mq.removeListener?.(fn); };
  },[]);
  const [ov,setOv]=useState(null);
  const [books,setBooks]=useState([]);
  const [sources,setSources]=useState([]);
  const [dlq,setDlq]=useState([]);
  const [prem,setPrem]=useState([]);
  const [banned,setBanned]=useState([]);
  const [allUsers,setAllUsers]=useState(null);   // {users:[],total:0}
  const [cacheBooks,setCacheBooks]=useState(null);
  const [recent,setRecent]=useState(null);
  const [failed,setFailed]=useState(null);
  const [heatmap,setHeatmap]=useState(null);
  const [drillId,setDrillId]=useState(null);
  const [ts,setTs]=useState(Date.now());
  const [toast,setToast]=useState(null);
  const [sidebar,setSidebar]=useState(()=>typeof window!=="undefined" ? !window.matchMedia?.("(max-width:768px)").matches : true);
  const [funnel,setFunnel]=useState(null);
  const [traces,setTraces]=useState([]);
  const [isMock,setIsMock]=useState(false);
  const [ago,setAgo]=useState("الآن");
  // ── DASH 2.0 state ──────────────────────────────
  const [logs,setLogs]=useState(null);
  const [bgLogs,setBgLogs]=useState(null);   // background poll for bell badge
  const [backup,setBackup]=useState(null);
  const [costs,setCosts]=useState(null);
  const [paletteOpen,setPaletteOpen]=useState(false);
  const [helpOpen,setHelpOpen]=useState(false);
  const [refreshInterval,setRefreshInterval]=useState(()=>{
    try { const v = parseInt(localStorage.getItem("bookbot_dash_refresh")||"30000",10); return isNaN(v)?30000:v; } catch { return 30000; }
  });
  useEffect(()=>{ try { localStorage.setItem("bookbot_dash_refresh",String(refreshInterval)); } catch {} },[refreshInterval]);

  const showToast=(msg,type="ok")=>setToast({msg,type});

  // tab ref للـ lazy load داخل useCallback
  const tabRef=useRef("overview");
  useEffect(()=>{tabRef.current=tab;},[tab]);

  const loadAll=useCallback(async()=>{
    // ── Core data (دائماً) ───────────────────
    const [r1,r2,r3,r4,r5,r6]=await Promise.allSettled([
      loadOv(),loadBooks(),loadSrc(),loadDLQ(),loadPrem(),loadBanned()
    ]);
    if(r1.status==="fulfilled")setOv(r1.value);
    if(r2.status==="fulfilled")setBooks(r2.value);
    if(r3.status==="fulfilled")setSources(r3.value);
    if(r4.status==="fulfilled")setDlq(r4.value);
    if(r5.status==="fulfilled")setPrem(r5.value);
    if(r6.status==="fulfilled")setBanned(r6.value);

    // ── Telemetry: فقط لما tab مفتوح ────────
    if(tabRef.current==="telemetry"){
      const [rt,rf]=await Promise.allSettled([loadTraces(),loadFunnel()]);
      if(rt.status==="fulfilled")setTraces(rt.value);
      if(rf.status==="fulfilled")setFunnel(rf.value);
    }

    // ── All users: فقط لما users tab مفتوح ──
    if(tabRef.current==="users"){
      const r=await apiFetch("users/all?limit=200").catch(()=>null);
      if(r)setAllUsers(r);
    }

    // ── Cached books: فقط لما cache tab مفتوح ──
    if(tabRef.current==="cache"){
      const r=await apiFetch("db/cached-books?limit=300").catch(()=>null);
      if(r)setCacheBooks(r);
    }

    // ── Recent searches: فقط لما recent tab مفتوح ──
    if(tabRef.current==="recent"){
      const r=await apiFetch("db/recent-searches?limit=100").catch(()=>null);
      if(r)setRecent(r);
    }

    // ── DASH 2.0: Logs tab يحتاج refresh على كل tick ──
    if(tabRef.current==="logs"){
      const r=await loadLogs(300).catch(()=>null);
      if(r)setLogs(r);
    }

    // ── DASH 2.0: Costs widget في overview tab ──
    if(tabRef.current==="overview"){
      const r=await loadCosts().catch(()=>null);
      if(r)setCosts(r);
    }

    // ── DASH 2.0: Backup card في system tab ──
    if(tabRef.current==="system"){
      const r=await loadBackup().catch(()=>null);
      if(r)setBackup(r);
    }

    // ── DASH 2.0: Background log poll للـ notification bell (50 سطر فقط) ──
    // كل 60 ثانية حتى لو لم نكن في logs tab — عشان الجرس يحدّث الـ badge.
    const r = await loadLogs(50).catch(()=>null);
    if(r) setBgLogs(r);

    setIsMock(_mock);
    setTs(Date.now());
  },[]);

  // لما يفتح telemetry tab لأول مرة، اجلب البيانات فوراً
  const prevTabRef=useRef("overview");
  useEffect(()=>{
    if(tab==="telemetry"&&prevTabRef.current!=="telemetry"){
      Promise.allSettled([loadTraces(),loadFunnel()]).then(([rt,rf])=>{
        if(rt.status==="fulfilled")setTraces(rt.value);
        if(rf.status==="fulfilled")setFunnel(rf.value);
      });
    }
    // لما يفتح users tab لأول مرة، اجلب كل المستخدمين فوراً
    if(tab==="users"&&prevTabRef.current!=="users"){
      apiFetch("users/all?limit=200").then(r=>{if(r)setAllUsers(r);}).catch(()=>{});
    }
    if(tab==="cache"&&prevTabRef.current!=="cache"){
      apiFetch("db/cached-books?limit=300").then(r=>{if(r)setCacheBooks(r);}).catch(()=>{});
    }
    if(tab==="recent"&&prevTabRef.current!=="recent"){
      apiFetch("db/recent-searches?limit=100").then(r=>{if(r)setRecent(r);}).catch(()=>{});
    }
    if(tab==="failed"&&prevTabRef.current!=="failed"){
      apiFetch("db/failed-searches?limit=200").then(r=>{if(r)setFailed(r);}).catch(()=>{});
    }
    if(tab==="analytics"&&prevTabRef.current!=="analytics"&&!heatmap){
      apiFetch("db/hourly-heatmap").then(r=>{if(r)setHeatmap(r);}).catch(()=>{});
    }
    // ── DASH 2.0 — fetch immediately when tab opens ──
    if(tab==="logs"&&prevTabRef.current!=="logs"){
      loadLogs(300).then(r=>{if(r)setLogs(r);}).catch(()=>{});
    }
    if(tab==="system"&&prevTabRef.current!=="system"){
      loadBackup().then(r=>{if(r)setBackup(r);}).catch(()=>{});
    }
    if(tab==="overview"&&prevTabRef.current!=="overview"){
      loadCosts().then(r=>{if(r)setCosts(r);}).catch(()=>{});
    }
    prevTabRef.current=tab;
  },[tab]);

  useEffect(()=>{
    loadAll();
    if(refreshInterval<=0) return; // الإيقاف اليدوي
    const t=setInterval(loadAll,refreshInterval);
    return()=>clearInterval(t);
  },[loadAll,refreshInterval]);

  // ── DASH 2.0: Keyboard shortcuts (Ctrl+K, ?, r, g+letter) ──────
  useEffect(()=>{
    const tabIdByKey = {o:"overview",a:"analytics",b:"books",c:"cache",q:"queue",
                       u:"users",s:"sources",t:"telemetry",l:"logs",m:"system"};
    let gPending = false;
    let gTimer = null;
    const isTyping = () => {
      const a = document.activeElement;
      if(!a) return false;
      const t = (a.tagName||"").toLowerCase();
      return t==="input"||t==="textarea"||t==="select"||a.isContentEditable;
    };
    const onKey = (e)=>{
      // Ctrl+K / Cmd+K — أفضل ما يكون فعّال حتى أثناء الكتابة
      if((e.ctrlKey||e.metaKey)&&(e.key==="k"||e.key==="K")){
        e.preventDefault();
        setPaletteOpen(o=>!o);
        return;
      }
      if(isTyping()) return;
      if(e.key==="?"){ e.preventDefault(); setHelpOpen(true); return; }
      if(e.key==="r"||e.key==="R"){ e.preventDefault(); loadAll(); return; }
      if(e.key==="Escape"){ setPaletteOpen(false); setHelpOpen(false); return; }
      if(e.key==="g"||e.key==="G"){
        gPending = true;
        if(gTimer) clearTimeout(gTimer);
        gTimer = setTimeout(()=>{ gPending=false; }, 1000);
        return;
      }
      if(gPending && tabIdByKey[e.key.toLowerCase()]){
        gPending = false;
        if(gTimer) clearTimeout(gTimer);
        setTab(tabIdByKey[e.key.toLowerCase()]);
        return;
      }
    };
    document.addEventListener("keydown",onKey);
    return ()=>{ document.removeEventListener("keydown",onKey); if(gTimer) clearTimeout(gTimer); };
  },[loadAll]);

  useEffect(()=>{
    const t=setInterval(()=>{
      const s=Math.floor((Date.now()-ts)/1000);
      setAgo(s<5?"الآن":s<60?`${s}ث`:`${Math.floor(s/60)}د`);
    },1000);
    return()=>clearInterval(t);
  },[ts]);

  const maintenance=ov?.system?.maintenance;

  const handleToggleMaint=async()=>{
    await apiAct("PUT","maintenance",{active:!maintenance});
    showToast(maintenance?"✅ إيقاف الصيانة":"🔴 الصيانة مفعّلة",maintenance?"ok":"warn");
    loadAll();
  };
  const handleClearBL=async()=>{
    if(!confirm("مسح Blacklist؟"))return;
    await apiAct("DELETE","blacklist");
    showToast("✅ تم مسح Blacklist");loadAll();
  };

  // sidebarOpen: على الموبايل = drawer مفتوح/مقفول. على الديسكتوب = expanded/collapsed.
  const sidebarOpen = isMobile ? sidebar : true;       // dummy on desktop, always rendered
  const sidebarWidth = isMobile ? 240 : (sidebar?220:62);
  const closeSidebar = ()=>setSidebar(false);
  const toggleSidebar = ()=>setSidebar(p=>!p);

  return h("div",{style:{display:"flex",minHeight:"100vh",background:T.bg,position:"relative"}},
    // Mobile backdrop
    isMobile && sidebar && h("div",{className:"sidebar-backdrop",onClick:closeSidebar}),
    // Sidebar
    h("div",{className:`sidebar ${isMobile&&!sidebar?"closed":""}`,
      style:{width:sidebarWidth,background:T.surface,borderLeft:`1px solid ${T.border}`,
      display:"flex",flexDirection:"column",transition:"width .25s cubic-bezier(.4,0,.2,1)",
      overflow:"hidden",flexShrink:0,position:isMobile?"fixed":"sticky",top:0,height:"100vh"}},
      h("div",{style:{padding:"20px 14px 16px",borderBottom:`1px solid ${T.border}`,
        display:"flex",alignItems:"center",gap:12,overflow:"hidden"}},
        h("div",{className:"glow",style:{width:42,height:42,borderRadius:12,flexShrink:0,
          background:`linear-gradient(145deg,${T.gold},${T.goldDim})`,
          display:"flex",alignItems:"center",justifyContent:"center",fontSize:21,
          boxShadow:`0 6px 20px ${T.gold}33`}},"📚"),
        (sidebar||isMobile)&&h("div",{style:{overflow:"hidden",lineHeight:1.35,flex:1}},
          h("div",{style:{color:T.gold,fontWeight:800,fontSize:14,whiteSpace:"nowrap"}},"خلاصة الكتب"),
          h("div",{style:{color:T.muted,fontSize:10,whiteSpace:"nowrap",fontWeight:500}},"مركز العمليات")
        ),
        // Close button on mobile drawer
        isMobile && h("button",{onClick:closeSidebar,style:{background:"transparent",border:"none",
          color:T.muted,fontSize:18,padding:4,cursor:"pointer"}},"✕")
      ),
      h("nav",{style:{flex:1,padding:"8px 8px 12px",display:"flex",flexDirection:"column",gap:1,overflowY:"auto"}},
        (typeof TAB_GROUPS!=="undefined"?TAB_GROUPS:["رئيسي","محتوى","تشغيل","مراقبة"]).flatMap(group=>{
          const items=TABS.filter(t=>t.group===group);
          if(!items.length) return [];
          const nodes=[];
          if(sidebar||isMobile) nodes.push(h("div",{key:"g-"+group,className:"nav-group-label"},group));
          items.forEach(t=>nodes.push(
            h("button",{key:t.id,className:`nav-item ${tab===t.id?"active":""}`,
              onClick:()=>{ setTab(t.id); if(isMobile) closeSidebar(); }, title:t.label},
              h("span",{style:{fontSize:17,flexShrink:0,width:22,textAlign:"center"}},t.icon),
              (sidebar||isMobile)&&h("span",{style:{whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},t.label)
            )
          ));
          return nodes;
        })
      ),
      // Footer: logout + collapse toggle
      h("div",{style:{borderTop:`1px solid ${T.border}`,padding:"8px",display:"flex",flexDirection:"column",gap:4}},
        (sidebar||isMobile)&&h("button",{className:"btn btn-danger btn-md",onClick:onLogout,style:{width:"100%",justifyContent:"flex-start"}},"🚪  تسجيل خروج"),
        !isMobile && h("button",{onClick:toggleSidebar,style:{background:"transparent",border:"none",color:T.muted,padding:8,fontSize:14}},sidebar?"◀ طيّ":"▶")
      )
    ),
    // Main
    h("div",{style:{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minWidth:0}},
      // Topbar
      h("div",{className:"topbar",style:{background:T.surface,borderBottom:`1px solid ${T.border}`,
        padding:"0 20px",height:56,display:"flex",alignItems:"center",
        justifyContent:"space-between",flexShrink:0,position:"sticky",top:0,zIndex:100}},
        h("div",{style:{display:"flex",alignItems:"center",gap:10,minWidth:0,flex:1}},
          // Hamburger button (mobile only)
          isMobile && h("button",{onClick:toggleSidebar,"aria-label":"menu",style:{background:"transparent",
            border:"none",color:T.text,fontSize:22,padding:"4px 8px",cursor:"pointer"}},"☰"),
          h("span",{className:"topbar-title",style:{fontSize:17,fontWeight:800,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},
            TABS.find(t=>t.id===tab)?.icon," ",TABS.find(t=>t.id===tab)?.label),
          maintenance&&h(Tag,{color:T.red},"🔴 صيانة"),
          isMock&&h(Tag,{color:T.orange},"🟡 بيانات تجريبية")
        ),
        h("div",{style:{display:"flex",alignItems:"center",gap:8,flexShrink:0}},
          !isMock&&h("span",{className:"topbar-status"},h(Tag,{color:T.green,size:11},"🟢 متصل")),
          h("div",{className:"topbar-status",style:{display:"flex",alignItems:"center",gap:5,fontSize:11,color:T.muted}},
            h(Dot)," ",ago),
          // DASH 2.0: Auto-refresh control + bell + palette + help
          !isMobile && h(AutoRefreshControl,{intervalMs:refreshInterval,setIntervalMs:setRefreshInterval,onRefreshNow:loadAll,lastTs:ts}),
          h(NotificationBell,{logs:bgLogs,onClick:()=>setTab("logs")}),
          h("button",{onClick:()=>setPaletteOpen(true),title:"قائمة الأوامر (Ctrl+K)",style:{
            background:"transparent",border:`1px solid ${T.border}`,color:T.muted,
            width:34,height:34,borderRadius:8,cursor:"pointer",fontSize:14
          }},"⌨"),
          h("button",{onClick:()=>setHelpOpen(true),title:"اختصارات (?)",style:{
            background:"transparent",border:`1px solid ${T.border}`,color:T.muted,
            width:34,height:34,borderRadius:8,cursor:"pointer",fontSize:14
          }},"?"),
          !isMobile && h("div",{className:"tag",style:{background:T.goldDim+"30",border:`1px solid ${T.goldDim}`,
            color:T.gold,padding:"5px 12px",fontSize:11,fontWeight:700}},"🛡️  أدمن")
        )
      ),
      // Content
      h("div",{className:"content",style:{flex:1,overflowY:"auto",padding:"22px 18px"}},
        tab==="overview"  &&h(OverviewTab,{ov,costs}),
        tab==="analytics" &&h(AnalyticsTab,{weekly:ov?.weekly||[],heatmap}),
        tab==="books"     &&h(BooksTab,{books}),
        tab==="failed"    &&h(FailedTab,{failed}),
        tab==="cache"     &&h(CacheTab,{books:cacheBooks}),
        tab==="recent"    &&h(RecentTab,{searches:recent}),
        tab==="sources"   &&h(SourcesTab,{sources}),
        tab==="queue"     &&h(QueueTab,{queue:ov?.queue,dlq,onToast:showToast,onRefresh:loadAll}),
        tab==="users"     &&h(UsersTab,{prem,banned,allUsers,onToast:showToast,onRefresh:loadAll,onUserClick:setDrillId}),
        tab==="system"    &&h(SystemTab,{system:ov?.system,backup,maintenance,onToggleMaint:handleToggleMaint,onClearBL:handleClearBL,onToast:showToast}),
        tab==="telemetry" &&h(TelemetryTab,{funnel,traces}),
        tab==="logs"      &&h(LogsTab,{logs,onRefresh:()=>loadLogs(300).then(r=>r&&setLogs(r))})
      )
    ),
    // ── DASH 2.0 overlays ──
    h(CommandPalette,{open:paletteOpen,onClose:()=>setPaletteOpen(false),
      onNavigate:(id)=>setTab(id),
      onAction:(id)=>{
        if(id==="refresh") loadAll();
        else if(id==="help") setHelpOpen(true);
        else if(id.startsWith("user:")) setDrillId(id.slice(5));
        // trace:<id> — simple navigation to telemetry
        else if(id.startsWith("trace:")) setTab("telemetry");
      },
      users:allUsers, books, traces}),
    helpOpen && h(HelpModal,{onClose:()=>setHelpOpen(false)}),
    h(QuickActionsFAB,{onPalette:()=>setPaletteOpen(true),onMaint:handleToggleMaint,maintenance}),
    toast&&h(Toast,{msg:toast.msg,type:toast.type,onDone:()=>setToast(null)}),
    drillId&&h(UserModal,{userId:drillId,onClose:()=>setDrillId(null),onAction:async(type,id2)=>{
      const m={
        grantPrem:()=>apiAct("POST",`users/${id2}/premium`,{enable:true}),
        revokePrem:()=>apiAct("POST",`users/${id2}/premium`,{enable:false}),
        ban:()=>apiAct("POST",`users/${id2}/ban`),
        unban:()=>apiAct("DELETE",`users/${id2}/ban`),
      };
      try{ await m[type]?.(); }catch(e){}
      const msgs={grantPrem:"⭐ تم منح التميز",revokePrem:"❌ تم إلغاء التميز",ban:"🚫 تم الحظر",unban:"✅ تم رفع الحظر"};
      showToast(msgs[type]||"تم");
      setDrillId(null);
      loadAll();
    }})
  );
}

// ══════════════════════════════════════════════
// LOGIN SCREEN — يطلب DASHBOARD_SECRET ويحفظه في localStorage
// ══════════════════════════════════════════════
function Login({onLogin}){
  const [val,setVal]=useState("");
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);
  const submit=async(e)=>{
    e?.preventDefault?.();
    const t=val.trim();
    if(!t){ setErr("أدخل مفتاح لوحة الإدارة (Dashboard Secret)"); return; }
    setBusy(true); setErr("");
    try{
      const r=await fetch(`${API_BASE}/api/admin/overview`,{headers:{Authorization:`Bearer ${t}`}});
      if(r.status===200){ setToken(t); onLogin(); }
      else if(r.status===401||r.status===403){ setErr("المفتاح غير صحيح — تحقّق من .env"); }
      else if(r.status===503){ setErr("DASHBOARD_SECRET غير مضبوط على السيرفر"); }
      else{ setErr(`خطأ غير متوقع (HTTP ${r.status})`); }
    }catch{ setErr("تعذّر الاتصال بالسيرفر — تأكد أن البوت يعمل"); }
    finally{ setBusy(false); }
  };
  return h("div",{className:"login-shell fade-in"},
    h("form",{className:"login-card",onSubmit:submit,style:{display:"flex",flexDirection:"column",gap:18}},
      h("div",{style:{display:"flex",alignItems:"center",gap:14}},
        h("div",{className:"glow",style:{width:52,height:52,borderRadius:14,
          background:`linear-gradient(145deg,${T.gold},${T.goldDim})`,
          display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,
          boxShadow:`0 8px 28px ${T.gold}40`}},"📚"),
        h("div",null,
          h("div",{style:{color:T.gold,fontWeight:800,fontSize:18}},"خلاصة الكتب"),
          h("div",{style:{color:T.muted,fontSize:12,marginTop:2,fontWeight:500}},"مركز العمليات · لوحة الإدارة")
        )
      ),
      h("div",{style:{height:1,background:`linear-gradient(90deg,transparent,${T.border},transparent)`}}),
      h("div",null,
        h("div",{style:{fontSize:14,fontWeight:700,color:T.text,marginBottom:6}},"تسجيل الدخول"),
        h("div",{style:{fontSize:12,color:T.muted,lineHeight:1.75}},
          "أدخل ",h("span",{className:"mono",style:{color:T.gold}},"DASHBOARD_SECRET"),
          " من ملف ",h("span",{className:"mono",style:{color:T.gold}},".env"),
          " على السيرفر. يُحفظ محلياً في متصفحك فقط."
        )
      ),
      h("div",null,
        h("label",{style:{display:"block",fontSize:11,fontWeight:600,color:T.muted,marginBottom:8}},"مفتاح الوصول"),
        h("input",{type:"password",value:val,onChange:e=>setVal(e.target.value),
          placeholder:"••••••••••••••••",autoFocus:true,autoComplete:"off",
          style:{direction:"ltr",fontFamily:"'IBM Plex Mono',monospace",fontSize:15,padding:"12px 14px"}})
      ),
      err&&h("div",{style:{fontSize:12,color:T.red,background:T.redDim+"40",border:`1px solid ${T.red}40`,
        padding:"10px 12px",borderRadius:10,lineHeight:1.5}},"❌ ",err),
      h("button",{type:"submit",className:"btn btn-gold btn-lg",disabled:busy,style:{width:"100%",opacity:busy?.65:1}},
        busy?"… جاري التحقق":"🔓  دخول آمن"),
      h("div",{style:{fontSize:10,color:T.muted,textAlign:"center",lineHeight:1.6}},
        "محمي بمصادقة Bearer · حد معدّل 60 طلب/دقيقة")
    )
  );
}

// ═
// ROOT — يبدّل بين Login و App بناءً على وجود token
// ══════════════════════════════════════════════
class DashErrorBoundary extends React.Component {
  constructor(p){ super(p); this.state={err:null}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err, info){ try{ console.error("Dashboard crash:", err, info); }catch(e){} }
  render(){
    if(this.state.err){
      const msg = String(this.state.err && (this.state.err.message||this.state.err));
      return h("div",{style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",
        background:T.bg,color:T.text,padding:24,flexDirection:"column",gap:14,textAlign:"center"}},
        h("div",{style:{fontSize:40}},"⚠️"),
        h("div",{style:{fontSize:18,fontWeight:800,color:T.gold}},"تعذّر تحميل لوحة الإدارة"),
        h("div",{style:{fontSize:12,color:T.muted,maxWidth:420,lineHeight:1.7,direction:"ltr"}}, msg.slice(0,300)),
        h("button",{className:"btn btn-gold btn-md",onClick:()=>location.reload()},"🔄  إعادة تحميل"),
        h("button",{className:"btn btn-ghost btn-md",onClick:()=>{ try{localStorage.removeItem(TOKEN_KEY);}catch(e){} location.reload(); }},
          "🚪  تسجيل خروج وإعادة المحاولة")
      );
    }
    return this.props.children;
  }
}

function Root(){
  const [authed,setAuthed]=useState(()=>!!getToken());
  useEffect(()=>{
    setAuthLostHandler(()=>setAuthed(false));
    return ()=>setAuthLostHandler(null);
  },[]);
  if(!authed) return h(Login,{onLogin:()=>setAuthed(true)});
  return h(DashErrorBoundary,null,
    h(App,{onLogout:()=>{ setToken(""); setAuthed(false); }})
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(Root));
</script>
</body>
</html>
