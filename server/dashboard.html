<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>خلاصة الكتب — لوحة الإدارة</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07090f;color:#e6edf3;font-family:'Noto Kufi Arabic',sans-serif;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:#0d1117}::-webkit-scrollbar-thumb{background:#2d333b;border-radius:3px}
.mono{font-family:'IBM Plex Mono',monospace!important;direction:ltr;display:inline-block}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes glow{0%,100%{box-shadow:0 0 4px #d4a84344}50%{box-shadow:0 0 18px #d4a84388}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.pulse{animation:pulse 2.5s ease-in-out infinite}
.glow{animation:glow 2.5s ease-in-out infinite}
.fade-up{animation:fadeUp .3s ease forwards}
.hcard:hover{background:#191f28!important}
table{border-collapse:collapse;width:100%}th,td{padding:9px 12px;text-align:right}
input,select{background:#0d1117;border:1px solid #1e2533;border-radius:8px;color:#e6edf3;padding:8px 12px;font-family:inherit;font-size:13px;outline:none;width:100%}
input:focus,select:focus{border-color:#d4a84388}
button{cursor:pointer;font-family:'Noto Kufi Arabic',sans-serif}
.shimmer{background:linear-gradient(90deg,#2d333b 25%,#1e2533 50%,#2d333b 75%);background-size:400px;animation:shimmer 1.4s infinite}
#root{display:flex;height:100vh}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ══════════════════════════════════════════════
// CONFIG — يُقرأ تلقائياً من نفس السيرفر
// ══════════════════════════════════════════════
const ADMIN_ID = "5469997406";
const API_BASE = "";   // نفس الـ origin دائماً — لا mixed content
const REFRESH  = 30000;

// ══════════════════════════════════════════════
// MOCK DATA
// ══════════════════════════════════════════════
const MOCK = {
  today:{date:new Date().toISOString().slice(0,10),searches:847,downloads:621,success:574,fail:47,cacheHits:198,successRate:"92.4%",cacheRate:"31.9%",avgMs:3840,activeUsers:312},
  total:{totalSearches:48291,totalDownloads:34872},
  queue:{highQueue:2,normalQueue:11,dlqSize:3,totalActiveJobs:13},
  premium:{count:47},banned:{count:8},
  blacklist:{total:234,active:189},
  system:{uptimeHuman:"5ي 0س 0د",maintenance:false,redis:true,memory:{heapUsed:142,heapTotal:256,rss:310},workers:4,nodeVersion:"v20.11.0",pid:1337},
  weekly:[
    {date:"02-28",searches:620,downloads:441,success:398,fail:43,cacheHits:112,activeUsers:201,avgMs:4200},
    {date:"03-01",searches:710,downloads:523,success:489,fail:34,cacheHits:154,activeUsers:267,avgMs:3900},
    {date:"03-02",searches:530,downloads:389,success:351,fail:38,cacheHits:98, activeUsers:178,avgMs:4100},
    {date:"03-03",searches:890,downloads:671,success:623,fail:48,cacheHits:201,activeUsers:341,avgMs:3600},
    {date:"03-04",searches:780,downloads:590,success:552,fail:38,cacheHits:175,activeUsers:298,avgMs:3750},
    {date:"03-05",searches:910,downloads:688,success:641,fail:47,cacheHits:212,activeUsers:365,avgMs:3500},
    {date:"03-06",searches:847,downloads:621,success:574,fail:47,cacheHits:198,activeUsers:312,avgMs:3840},
  ],
  topBooks:[
    {title:"أرض زيكولا",count:89},{title:"الأمير الصغير",count:76},{title:"عزازيل",count:71},
    {title:"زقاق المدق",count:68},{title:"قواعد العشق الأربعون",count:52},{title:"موبي ديك",count:47},
    {title:"فرانكنشتاين في بغداد",count:43},{title:"مائة عام من العزلة",count:38},
  ],
  sources:[
    {domain:"archive.org",ok:187,fail:9,rate:"95%"},{domain:"foulabook.com",ok:143,fail:21,rate:"87%"},
    {domain:"noor-book.com",ok:112,fail:18,rate:"86%"},{domain:"pdfdrive.com",ok:98,fail:34,rate:"74%"},
    {domain:"z-lib.org",ok:76,fail:42,rate:"64%"},{domain:"kotobati.com",ok:54,fail:28,rate:"66%"},
  ],
  dlqJobs:[
    {bookName:"كتاب النجاح",userId:"112233445",failReason:"PDF download timeout 30s",createdAt:Date.now()-120000},
    {bookName:"مختصر المفيد",userId:"998877665",failReason:"All sources returned 404",createdAt:Date.now()-300000},
    {bookName:"مقدمة ابن خلدون",userId:"554433221",failReason:"File size exceeded 50MB",createdAt:Date.now()-600000},
  ],
  premiumUsers:["112233445","998877665","443322110","556677889","112299334"],
  bannedUsers:["909090909","111222333"],
};

// ══════════════════════════════════════════════
// API LAYER
// ══════════════════════════════════════════════
let _mock = false;

async function apiFetch(path, opts={}) {
  const url = `${API_BASE}/api/admin/${path}`;
  try {
    const r = await fetch(url,{...opts,headers:{Authorization:`Bearer ${ADMIN_ID}`,"Content-Type":"application/json",...(opts.headers||{})}});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    _mock = false;
    return j.data ?? j;
  } catch(e) {
    _mock = true;
    return null;
  }
}
async function apiAct(method,path,body){
  await apiFetch(path,{method,body:body?JSON.stringify(body):undefined});
  return true;
}
async function loadOv(){
  const d=await apiFetch("overview");
  if(d) return d;
  return {today:MOCK.today,total:MOCK.total,queue:MOCK.queue,premium:MOCK.premium,
          banned:MOCK.banned,blacklist:MOCK.blacklist,system:MOCK.system,weekly:MOCK.weekly};
}
async function loadBooks()  { return (await apiFetch("stats/top-books?limit=15")) ?? MOCK.topBooks; }
async function loadSrc()    { return (await apiFetch("stats/sources"))            ?? MOCK.sources; }
async function loadDLQ()    { return (await apiFetch("queue/dlq?limit=30"))        ?? MOCK.dlqJobs; }
async function loadPrem()   { return (await apiFetch("users/premium"))             ?? MOCK.premiumUsers; }
async function loadBanned() { return (await apiFetch("users/banned"))              ?? MOCK.bannedUsers; }
async function loadFunnel() { return (await apiFetch("telemetry/funnel"))           ?? null; }
async function loadTraces() { return (await apiFetch("telemetry/traces?limit=30"))  ?? []; }

// ══════════════════════════════════════════════
// TOKEN SHORTCUTS
// ══════════════════════════════════════════════
const T={
  bg:"#07090f",surface:"#0d1117",card:"#141920",border:"#1e2533",
  gold:"#d4a843",goldMid:"#b8902e",goldDim:"#7a5c18",
  green:"#3fb950",greenDim:"#1a4d23",red:"#f85149",redDim:"#4d1a18",
  blue:"#58a6ff",blueDim:"#1a3a5c",purple:"#bc8cff",orange:"#f0883e",
  text:"#e6edf3",textMid:"#adbac7",muted:"#636e7b",dim:"#2d333b",
};

const {
  AreaChart,Area,LineChart,Line,BarChart,Bar,RadialBarChart,RadialBar,
  XAxis,YAxis,CartesianGrid,Tooltip,ResponsiveContainer,Cell
} = Recharts;
const {useState,useEffect,useCallback,useRef,createElement:h} = React;

// ══════════════════════════════════════════════
// ATOMS
// ══════════════════════════════════════════════
const Card=({children,style={},className="",onClick})=>
  h("div",{className:`${onClick?"hcard":""} ${className}`,onClick,
    style:{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:20,transition:"background .15s",...style}},children);

const Tag=({children,color=T.gold,size=11})=>
  h("span",{style:{background:color+"20",color,border:`1px solid ${color}40`,
    padding:"2px 9px",borderRadius:20,fontSize:size,fontWeight:600,whiteSpace:"nowrap"}},children);

const HR=()=>h("div",{style:{height:1,margin:"14px 0",background:`linear-gradient(90deg,transparent,${T.border},transparent)`}});

const Dot=({color=T.green,size=8})=>
  h("span",{className:"pulse",style:{display:"inline-block",width:size,height:size,borderRadius:"50%",background:color,marginLeft:5,flexShrink:0}});

function Btn({children,onClick,variant="ghost",size="md",disabled=false}){
  const pad={sm:"5px 11px",md:"8px 18px",lg:"11px 24px"}[size]||"8px 18px";
  const fs={sm:11,md:13,lg:14}[size]||13;
  const v={
    ghost:{bg:"transparent",border:T.border,color:T.textMid},
    gold:{bg:T.goldDim+"40",border:T.goldDim,color:T.gold},
    danger:{bg:T.redDim+"40",border:T.redDim,color:T.red},
    success:{bg:T.greenDim+"40",border:T.greenDim,color:T.green},
    blue:{bg:T.blueDim+"40",border:T.blueDim,color:T.blue},
  }[variant]||{bg:"transparent",border:T.border,color:T.textMid};
  return h("button",{onClick,disabled,style:{background:v.bg,border:`1px solid ${v.border}`,color:v.color,
    padding:pad,borderRadius:8,fontSize:fs,display:"inline-flex",alignItems:"center",gap:5,
    opacity:disabled?.5:1,transition:"all .15s",whiteSpace:"nowrap",fontWeight:500}},children);
}

const SH=({icon,title,actions})=>
  h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}},
    h("div",{style:{display:"flex",alignItems:"center",gap:8,fontSize:15,fontWeight:700}},
      h("span",{style:{fontSize:18}},icon)," ",title),
    actions&&h("div",{style:{display:"flex",gap:8,flexWrap:"wrap"}},actions));

const CT=({active,payload,label})=>{
  if(!active||!payload?.length) return null;
  return h("div",{style:{background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,padding:"10px 14px",fontSize:12}},
    h("div",{style:{color:T.muted,marginBottom:6,fontWeight:600}},label),
    payload.map((p,i)=>h("div",{key:i,style:{display:"flex",alignItems:"center",gap:7,marginBottom:3}},
      h("span",{style:{width:9,height:9,borderRadius:2,background:p.color,flexShrink:0}}),
      h("span",{style:{color:T.muted,flex:1}},p.name),
      h("span",{className:"mono",style:{color:p.color,fontWeight:700}},p.value?.toLocaleString())
    ))
  );
};

const Sk=({w="100%",h:ht=20,r=6})=>
  h("div",{className:"shimmer",style:{width:w,height:ht,borderRadius:r}});

function Toast({msg,type="ok",onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3200);return()=>clearTimeout(t);},[]);
  const c=type==="ok"?T.green:type==="warn"?T.orange:T.red;
  return h("div",{className:"fade-up",style:{position:"fixed",bottom:28,left:"50%",transform:"translateX(-50%)",
    background:T.card,border:`1px solid ${c}60`,color:c,padding:"11px 22px",borderRadius:12,
    fontSize:13,fontWeight:600,zIndex:9999,display:"flex",alignItems:"center",gap:8}},
    type==="ok"?"✅":type==="warn"?"⚠️":"❌"," ",msg);
}

function KPI({icon,label,value,sub,color=T.gold,trend}){
  return h(Card,{style:{position:"relative",overflow:"hidden"}},
    h("div",{style:{position:"absolute",top:0,right:0,width:3,height:"100%",
      background:`linear-gradient(180deg,${color},${color}44)`,borderRadius:"0 14px 14px 0"}}),
    h("div",{style:{display:"flex",gap:12,alignItems:"flex-start"}},
      h("span",{style:{fontSize:24,lineHeight:1,marginTop:4}},icon),
      h("div",{style:{flex:1}},
        h("div",{style:{fontSize:11,color:T.muted,marginBottom:5,fontWeight:500}},label),
        h("div",{className:"mono",style:{fontSize:26,fontWeight:700,color,lineHeight:1}},value||"—"),
        sub&&h("div",{style:{fontSize:11,color:T.muted,marginTop:5}},sub),
        trend!=null&&h("div",{style:{fontSize:11,marginTop:4,color:trend>0?T.green:trend<0?T.red:T.muted}},
          trend>0?"↑":trend<0?"↓":"→"," ",Math.abs(trend),"%")
      )
    )
  );
}

// ══════════════════════════════════════════════
// TABS
// ══════════════════════════════════════════════

function OverviewTab({ov}){
  if(!ov) return h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:12}},
    Array(12).fill(0).map((_,i)=>h(Card,{key:i},h(Sk,{h:70}))));
  const {today,total,queue,premium,banned,system}=ov;
  const sr=today.downloads>0?((today.success/today.downloads)*100).toFixed(1):"0";
  const kpis=[
    {icon:"🔍",label:"بحث اليوم",value:today.searches.toLocaleString(),color:T.blue,sub:`إجمالي: ${total.totalSearches.toLocaleString()}`},
    {icon:"📥",label:"تحميل اليوم",value:today.downloads.toLocaleString(),color:T.gold,sub:`إجمالي: ${total.totalDownloads.toLocaleString()}`,trend:8},
    {icon:"✅",label:"نسبة النجاح",value:`${sr}٪`,color:+sr>=90?T.green:+sr>=70?T.orange:T.red,sub:`${today.success} نجاح`},
    {icon:"⚡",label:"من الكاش",value:today.cacheHits.toLocaleString(),color:T.purple,sub:today.cacheRate},
    {icon:"👥",label:"نشطون اليوم",value:today.activeUsers.toLocaleString(),color:T.blue},
    {icon:"⏱️",label:"متوسط الاستجابة",value:`${today.avgMs}ms`,color:today.avgMs<5000?T.green:T.red},
    {icon:"⭐",label:"مميزون",value:premium.count,color:T.gold},
    {icon:"🔄",label:"الطابور",value:queue.totalActiveJobs,color:T.orange,sub:`H:${queue.highQueue} N:${queue.normalQueue}`},
    {icon:"💀",label:"DLQ",value:queue.dlqSize,color:queue.dlqSize>10?T.red:T.muted},
    {icon:"🚫",label:"محظورون",value:banned.count,color:T.red},
    {icon:"💾",label:"Heap",value:`${system.memory.heapUsed}MB`,color:T.muted,sub:`RSS:${system.memory.rss}MB`},
    {icon:"⏰",label:"Uptime",value:system.uptimeHuman,color:T.green,sub:`${system.workers} workers`},
  ];
  return h("div",{className:"fade-up"},
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:12}},
      kpis.map((k,i)=>h(KPI,{key:i,...k}))),
    system.maintenance&&h("div",{style:{marginTop:16,background:T.redDim,border:`1px solid ${T.red}55`,
      borderRadius:12,padding:"12px 18px",color:T.red,fontWeight:600,fontSize:13}},
      "🔴 وضع الصيانة مفعّل — البوت لا يستقبل طلبات")
  );
}

function AnalyticsTab({weekly}){
  if(!weekly?.length) return h(Card,null,h(Sk,{h:260}));
  const data=weekly.map(d=>({...d,
    "نجاح٪":d.downloads>0?+((d.success/d.downloads)*100).toFixed(1):0,
    "كاش٪":d.success>0?+((d.cacheHits/d.success)*100).toFixed(1):0,
  }));
  return h("div",{className:"fade-up",style:{display:"flex",flexDirection:"column",gap:16}},
    h(Card,null,
      h(SH,{icon:"📈",title:"الحركة اليومية — آخر 7 أيام"}),
      h(ResponsiveContainer,{width:"100%",height:220},
        h(AreaChart,{data,margin:{top:4,right:4,left:-24,bottom:0}},
          h("defs",null,
            ["gB","gG","gGr","gP"].map((id,i)=>
              h("linearGradient",{key:id,id,x1:"0",y1:"0",x2:"0",y2:"1"},
                h("stop",{offset:"5%",stopColor:[T.blue,T.gold,T.green,T.purple][i],stopOpacity:.35}),
                h("stop",{offset:"95%",stopColor:[T.blue,T.gold,T.green,T.purple][i],stopOpacity:0})
              )
            )
          ),
          h(CartesianGrid,{strokeDasharray:"3 3",stroke:T.border}),
          h(XAxis,{dataKey:"date",tick:{fontSize:11,fill:T.muted},stroke:T.border}),
          h(YAxis,{tick:{fontSize:10,fill:T.muted},stroke:T.border}),
          h(Tooltip,{content:h(CT)}),
          h(Area,{type:"monotone",dataKey:"searches",name:"بحث",stroke:T.blue,fill:"url(#gB)",strokeWidth:2}),
          h(Area,{type:"monotone",dataKey:"downloads",name:"تحميل",stroke:T.gold,fill:"url(#gG)",strokeWidth:2}),
          h(Area,{type:"monotone",dataKey:"success",name:"نجاح",stroke:T.green,fill:"url(#gGr)",strokeWidth:2}),
          h(Area,{type:"monotone",dataKey:"cacheHits",name:"كاش",stroke:T.purple,fill:"url(#gP)",strokeWidth:2})
        )
      ),
      h("div",{style:{display:"flex",gap:16,marginTop:8,flexWrap:"wrap"}},
        [["بحث",T.blue],["تحميل",T.gold],["نجاح",T.green],["كاش",T.purple]].map(([k,c])=>
          h("div",{key:k,style:{display:"flex",alignItems:"center",gap:5,fontSize:12}},
            h("span",{style:{width:14,height:3,background:c,display:"inline-block",borderRadius:2}}),
            h("span",{style:{color:T.muted}},k)
          )
        )
      )
    ),
    h(Card,null,
      h(SH,{icon:"📅",title:"جدول يومي تفصيلي"}),
      h("div",{style:{overflowX:"auto"}},
        h("table",null,
          h("thead",null,h("tr",{style:{borderBottom:`2px solid ${T.border}`}},
            ["التاريخ","بحث","تحميل","نجاح","فشل","كاش","نجاح٪","كاش٪","مستخدمون","⏱ms"].map(hd=>
              h("th",{key:hd,style:{color:T.muted,fontWeight:500,fontSize:11,paddingBottom:10,whiteSpace:"nowrap"}},hd)
            )
          )),
          h("tbody",null,weekly.map((d,i)=>{
            const sr2=d.downloads>0?((d.success/d.downloads)*100).toFixed(1):"0";
            const cr=d.success>0?((d.cacheHits/d.success)*100).toFixed(1):"0";
            return h("tr",{key:i,style:{borderBottom:`1px solid ${T.border}20`}},
              h("td",{className:"mono",style:{color:T.muted,fontSize:12}},d.date),
              h("td",{className:"mono",style:{color:T.blue,fontWeight:600}},d.searches),
              h("td",{className:"mono",style:{color:T.gold,fontWeight:600}},d.downloads),
              h("td",{className:"mono",style:{color:T.green,fontWeight:600}},d.success),
              h("td",{className:"mono",style:{color:d.fail>0?T.red:T.muted}},d.fail),
              h("td",{className:"mono",style:{color:T.purple,fontWeight:600}},d.cacheHits),
              h("td",null,h(Tag,{color:+sr2>=90?T.green:+sr2>=70?T.orange:T.red},`${sr2}٪`)),
              h("td",null,h(Tag,{color:T.purple},`${cr}٪`)),
              h("td",{className:"mono",style:{color:T.textMid}},d.activeUsers),
              h("td",{className:"mono",style:{color:d.avgMs>6000?T.red:T.green,fontSize:11}},d.avgMs)
            );
          }))
        )
      )
    )
  );
}

function BooksTab({books}){
  if(!books?.length) return h(Card,null,h(Sk,{h:300}));
  const max=books[0]?.count||1;
  const medals=["🥇","🥈","🥉","4️⃣","5️⃣","6️⃣","7️⃣","8️⃣","9️⃣","🔟"];
  const barData=books.slice(0,8).map(b=>({name:b.title.slice(0,18),طلبات:b.count}));
  return h("div",{className:"fade-up",style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}},
    h(Card,null,
      h(SH,{icon:"🏆",title:"أكثر الكتب طلباً"}),
      h("div",{style:{display:"flex",flexDirection:"column",gap:12}},
        books.slice(0,10).map((b,i)=>{
          const pct=(b.count/max)*100;
          const c=i===0?T.gold:i===1?"#c0c0c0":i===2?"#cd7f32":T.dim;
          return h("div",{key:i},
            h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4,fontSize:13}},
              h("span",null,medals[i]," ",h("span",{style:{fontWeight:i<3?600:400}},b.title.slice(0,32))),
              h("span",{className:"mono",style:{color:c,fontWeight:700,fontSize:14}},b.count)
            ),
            h("div",{style:{background:T.dim,borderRadius:4,height:5,overflow:"hidden"}},
              h("div",{style:{background:c,width:`${pct}%`,height:"100%",borderRadius:4,transition:"width .6s"}})
            )
          );
        })
      )
    ),
    h(Card,null,
      h(SH,{icon:"📊",title:"توزيع الطلبات"}),
      h(ResponsiveContainer,{width:"100%",height:320},
        h(BarChart,{data:barData,layout:"vertical",margin:{top:0,right:30,left:0,bottom:0}},
          h(CartesianGrid,{strokeDasharray:"3 3",stroke:T.border,horizontal:false}),
          h(XAxis,{type:"number",tick:{fontSize:10,fill:T.muted},stroke:T.border}),
          h(YAxis,{dataKey:"name",type:"category",tick:{fontSize:10,fill:T.textMid},stroke:T.border,width:80}),
          h(Tooltip,{content:h(CT)}),
          h(Bar,{dataKey:"طلبات",radius:[0,6,6,0]},
            barData.map((_,i)=>h(Cell,{key:i,fill:i===0?T.gold:i===1?T.goldMid:i===2?"#b87333":T.dim}))
          )
        )
      )
    )
  );
}

function SourcesTab({sources}){
  if(!sources?.length) return h(Card,null,h(Sk,{h:200}));
  return h("div",{className:"fade-up"},
    h(Card,null,
      h(SH,{icon:"🔌",title:"صحة المصادر"}),
      h("table",null,
        h("thead",null,h("tr",{style:{borderBottom:`2px solid ${T.border}`}},

function PhaseLine({phase,i}){
  const icons={"request_started":"🚀","search_done":"🔍","verify_done":"🔎",
    "download_started":"📥","download_done":"✅","request_done":"🏁"};
  const icon=icons[phase.name]||"•";
  const dataStr=phase.data?Object.entries(phase.data)
    .filter(([k])=>k!=="ms")
    .map(([k,v])=>`${k}: ${JSON.stringify(v)}`).join("  "):"";
  const ms=phase.data?.ms!=null?` +${phase.data.ms}ms`:"";
  return h("div",{style:{
    display:"flex",alignItems:"flex-start",gap:10,padding:"6px 0",
    borderBottom:i>0?`1px solid ${T.border}22`:"none",
  }},
    h("span",{style:{width:24,flexShrink:0,textAlign:"center"}},icon),
    h("div",{style:{flex:1,minWidth:0}},

  {id:"overview",icon:"🏠",label:"نظرة عامة"},
  {id:"analytics",icon:"📊",label:"التحليلات"},

  {id:"queue",icon:"🔄",label:"الطابور"},
  {id:"users",icon:"👥",label:"المستخدمون"},

];

function App(){
  const [tab,setTab]=useState("overview");
  const [ov,setOv]=useState(null);
  const [books,setBooks]=useState([]);
  const [sources,setSources]=useState([]);
  const [dlq,setDlq]=useState([]);
  const [prem,setPrem]=useState([]);
  const [banned,setBanned]=useState([]);
  const [ts,setTs]=useState(Date.now());
  const [toast,setToast]=useState(null);
  const [sidebar,setSidebar]=useState(true);
  const [funnel,setFunnel]=useState(null);
  const [traces,setTraces]=useState([]);
  const [isMock,setIsMock]=useState(false);
  const [ago,setAgo]=useState("الآن");

  const showToast=(msg,type="ok")=>setToast({msg,type});

  // tab ref للـ lazy load داخل useCallback
  const tabRef=useRef("overview");
  useEffect(()=>{tabRef.current=tab;},[tab]);

  const loadAll=useCallback(async()=>{
    // ── Core data (دائماً) ───────────────────
    const [r1,r2,r3,r4,r5,r6]=await Promise.allSettled([
      loadOv(),loadBooks(),loadSrc(),loadDLQ(),loadPrem(),loadBanned()
    ]);
    if(r1.status==="fulfilled")setOv(r1.value);
    if(r2.status==="fulfilled")setBooks(r2.value);
    if(r3.status==="fulfilled")setSources(r3.value);
    if(r4.status==="fulfilled")setDlq(r4.value);
    if(r5.status==="fulfilled")setPrem(r5.value);
    if(r6.status==="fulfilled")setBanned(r6.value);

    // ── Telemetry: فقط لما tab مفتوح ────────
    if(tabRef.current==="telemetry"){
      const [rt,rf]=await Promise.allSettled([loadTraces(),loadFunnel()]);
      if(rt.status==="fulfilled")setTraces(rt.value);
      if(rf.status==="fulfilled")setFunnel(rf.value);
    }

    setIsMock(_mock);
    setTs(Date.now());
  },[]);

  // لما يفتح telemetry tab لأول مرة، اجلب البيانات فوراً
  const prevTabRef=useRef("overview");
  useEffect(()=>{
    if(tab==="telemetry"&&prevTabRef.current!=="telemetry"){
      Promise.allSettled([loadTraces(),loadFunnel()]).then(([rt,rf])=>{
        if(rt.status==="fulfilled")setTraces(rt.value);
        if(rf.status==="fulfilled")setFunnel(rf.value);
      });
    }
    prevTabRef.current=tab;
  },[tab]);

  useEffect(()=>{
    loadAll();
    const t=setInterval(loadAll,REFRESH);
    return()=>clearInterval(t);
  },[loadAll]);

  useEffect(()=>{
    const t=setInterval(()=>{
      const s=Math.floor((Date.now()-ts)/1000);
      setAgo(s<5?"الآن":s<60?`${s}ث`:`${Math.floor(s/60)}د`);
    },1000);
    return()=>clearInterval(t);
  },[ts]);

  const maintenance=ov?.system?.maintenance;

  const handleToggleMaint=async()=>{
    await apiAct("PUT","maintenance",{active:!maintenance});
    showToast(maintenance?"✅ إيقاف الصيانة":"🔴 الصيانة مفعّلة",maintenance?"ok":"warn");
    loadAll();
  };
  const handleClearBL=async()=>{
    if(!confirm("مسح Blacklist؟"))return;
    await apiAct("DELETE","blacklist");
    showToast("✅ تم مسح Blacklist");loadAll();
  };

  return h("div",{style:{display:"flex",minHeight:"100vh",background:T.bg}},
    // Sidebar
    h("div",{style:{width:sidebar?220:62,background:T.surface,borderLeft:`1px solid ${T.border}`,
      display:"flex",flexDirection:"column",transition:"width .25s cubic-bezier(.4,0,.2,1)",
      overflow:"hidden",flexShrink:0,position:"sticky",top:0,height:"100vh"}},
      h("div",{style:{padding:"18px 14px",borderBottom:`1px solid ${T.border}`,
        display:"flex",alignItems:"center",gap:10,overflow:"hidden"}},
        h("div",{className:"glow",style:{width:38,height:38,borderRadius:10,flexShrink:0,
          background:`linear-gradient(135deg,${T.goldDim},${T.gold})`,
          display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}},"📚"),
        sidebar&&h("div",{style:{overflow:"hidden",lineHeight:1.3}},
          h("div",{style:{color:T.gold,fontWeight:800,fontSize:13,whiteSpace:"nowrap"}},"خلاصة الكتب"),
          h("div",{style:{color:T.muted,fontSize:10,whiteSpace:"nowrap"}},"لوحة الإدارة")
        )
      ),
      h("nav",{style:{flex:1,padding:"10px 8px",display:"flex",flexDirection:"column",gap:2,overflowY:"auto"}},
        TABS.map(t=>h("button",{key:t.id,onClick:()=>setTab(t.id),style:{
          background:tab===t.id?T.goldDim+"30":"transparent",
          border:`1px solid ${tab===t.id?T.gold+"55":"transparent"}`,
          color:tab===t.id?T.gold:T.muted,
          padding:"9px 10px",borderRadius:9,display:"flex",alignItems:"center",
          gap:9,transition:"all .15s",textAlign:"right",width:"100%"}},
          h("span",{style:{fontSize:17,flexShrink:0}},t.icon),
          sidebar&&h("span",{style:{fontSize:13,fontWeight:tab===t.id?600:400,whiteSpace:"nowrap"}},t.label)
        ))
      ),
      h("button",{onClick:()=>setSidebar(p=>!p),style:{background:"transparent",border:"none",color:T.muted,padding:14,borderTop:`1px solid ${T.border}`,fontSize:14}},sidebar?"◀":"▶")
    ),
    // Main
    h("div",{style:{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}},
      // Topbar
      h("div",{style:{background:T.surface,borderBottom:`1px solid ${T.border}`,
        padding:"0 20px",height:56,display:"flex",alignItems:"center",
        justifyContent:"space-between",flexShrink:0,position:"sticky",top:0,zIndex:100}},
        h("div",{style:{display:"flex",alignItems:"center",gap:10}},
          h("span",{style:{fontSize:17,fontWeight:800}},
            TABS.find(t=>t.id===tab)?.icon," ",TABS.find(t=>t.id===tab)?.label),
          maintenance&&h(Tag,{color:T.red},"🔴 صيانة"),
          isMock&&h(Tag,{color:T.orange},"🟡 بيانات تجريبية")
        ),
        h("div",{style:{display:"flex",alignItems:"center",gap:10}},
          !isMock&&h(Tag,{color:T.green,size:11},"🟢 متصل"),
          h("div",{style:{display:"flex",alignItems:"center",gap:5,fontSize:11,color:T.muted}},
            h(Dot)," ",ago),
          h(Btn,{variant:"gold",size:"sm",onClick:loadAll},"🔄"),
          h("div",{style:{background:T.goldDim+"30",border:`1px solid ${T.goldDim}`,
            color:T.gold,padding:"4px 10px",borderRadius:8,fontSize:11,fontWeight:600}},"🛡️ أدمن")
        )
      ),
      // Content
      h("div",{style:{flex:1,overflowY:"auto",padding:"22px 18px"}},
        tab==="overview"  &&h(OverviewTab,{ov}),
        tab==="analytics" &&h(AnalyticsTab,{weekly:ov?.weekly||[]}),
        tab==="books"     &&h(BooksTab,{books}),
        tab==="sources"   &&h(SourcesTab,{sources}),
        tab==="queue"     &&h(QueueTab,{queue:ov?.queue,dlq,onToast:showToast,onRefresh:loadAll}),
        tab==="users"     &&h(UsersTab,{prem,banned,onToast:showToast,onRefresh:loadAll}),
        tab==="system"    &&h(SystemTab,{system:ov?.system,maintenance,onToggleMaint:handleToggleMaint,onClearBL:handleClearBL}),
        tab==="telemetry" &&h(TelemetryTab,{funnel,traces})
      )
    ),
    toast&&h(Toast,{msg:toast.msg,type:toast.type,onDone:()=>setToast(null)})
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
