let _mock = false;

async function apiFetch(path, opts={}) {
  const url = `${API_BASE}/api/admin/${path}`;
  try {
    const r = await fetch(url,{...opts,headers:{Authorization:`Bearer ${ADMIN_ID}`,"Content-Type":"application/json",...(opts.headers||{})}});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    _mock = false;
    return j.data ?? j;
  } catch(e) {
    _mock = true;
    return null;
  }
}
async function apiAct(method,path,body){
  await apiFetch(path,{method,body:body?JSON.stringify(body):undefined});
  return true;
}
function _norm(d){
  if(!d) return d;
  // total: API returns {searches,downloads,users}; UI wants {totalSearches,totalDownloads}
  if(d.total){
    d.total.totalSearches  = d.total.totalSearches  ?? d.total.searches  ?? 0;
    d.total.totalDownloads = d.total.totalDownloads ?? d.total.downloads ?? 0;
  }
  // today: derive missing fields
  if(d.today){
    d.today.success      = d.today.success      ?? d.today.found        ?? 0;
    d.today.fail         = d.today.fail         ?? Math.max(0,(d.today.searches||0)-(d.today.success||0));
    d.today.cacheHits    = d.today.cacheHits    ?? d.today.cache_hits    ?? 0;
    d.today.cacheRate    = d.today.cacheRate    ?? (d.today.searches>0?((d.today.cacheHits/d.today.searches)*100).toFixed(1)+"%":"0%");
    d.today.successRate  = d.today.successRate  ?? (d.today.searches>0?((d.today.success/d.today.searches)*100).toFixed(1)+"%":"0%");
    d.today.activeUsers  = d.today.activeUsers  ?? d.today.users         ?? 0;
    d.today.avgMs        = d.today.avgMs        ?? d.today.avg_ms        ?? 0;
  }
  // weekly: API returns object {date: {...}}; UI wants array [{date,...}]
  if(d.weekly && !Array.isArray(d.weekly)){
    d.weekly = Object.entries(d.weekly).map(([date,v])=>({
      date: date.slice(5),
      searches: v.searches||0,
      downloads: v.downloads||0,
      success: v.found??v.success??0,
      fail: Math.max(0,(v.searches||0)-(v.found??v.success??0)),
      cacheHits: v.cacheHits||v.cache_hits||0,
      activeUsers: v.activeUsers||v.users||0,
      avgMs: v.avgMs||v.avg_ms||0,
    })).sort((a,b)=>a.date.localeCompare(b.date));
  }
  return d;
}

// ══════════════════════════════════════════════
function exportCSV(filename, rows, columns){
  if(!rows?.length){alert("لا توجد بيانات للتصدير");return;}
  const header = columns.map(c=>`"${c.label.replace(/"/g,'""')}"`).join(",");
  const body = rows.map(r=>columns.map(c=>{
    let v = typeof c.get==="function" ? c.get(r) : r[c.key];
    if(v==null) v="";
    if(typeof v==="object") v=JSON.stringify(v);
    v=String(v).replace(/"/g,'""');
    return `"${v}"`;
  }).join(",")).join("\n");
  const csv = "\uFEFF"+header+"\n"+body;  // BOM for Excel UTF-8
  const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${filename}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── ErrorBoundary — يحمي Analytics من crash لو Recharts فشل ──
class ChartErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={err:false};}
  static getDerivedStateFromError(){return{err:true};}
  render(){
    if(this.state.err||!CHARTS_OK) return this.props.fallback||null;
    return this.props.children;
  }
}

function UsersTab({prem,banned,allUsers,onToast,onRefresh,onUserClick}){
  const [tab,setTab]=useState("manage");

  const [search,setSearch]=useState("");
  const SubBtn=({id,label})=>h("button",{onClick:()=>setTab(id),style:{
    background:tab===id?T.goldDim+"40":"transparent",border:`1px solid ${tab===id?T.gold:T.border}`,
    color:tab===id?T.gold:T.muted,padding:"6px 16px",borderRadius:8,fontSize:12,fontWeight:tab===id?600:400}},label);
  const act=async(type,id2=uid)=>{
    if(!id2.trim()){onToast("أدخل User ID أولاً","err");return;}
    const m={
      grantPrem:()=>apiAct("POST",`users/${id2}/premium`,{enable:true}),
      revokePrem:()=>apiAct("POST",`users/${id2}/premium`,{enable:false}),
      ban:()=>apiAct("POST",`users/${id2}/ban`),
      unban:()=>apiAct("DELETE",`users/${id2}/ban`),
      setLim:()=>apiAct("PUT",`users/${id2}/limit`,{limit:+lim}),
      resetLim:()=>apiAct("DELETE",`users/${id2}/limit`),

    await m[type]?.();

          h(Btn,{variant:"gold",onClick:()=>act("setLim")},"💾 حفظ"),

        )

        // شريط بحث

function PhaseLine({phase,i}){
  const icons={"request_started":"🚀","search_done":"🔍","verify_done":"🔎",
    "download_started":"📥","download_done":"✅","request_done":"🏁"};
  const icon=icons[phase.name]||"•";
  const dataStr=phase.data?Object.entries(phase.data)
    .filter(([k])=>k!=="ms")
    .map(([k,v])=>`${k}: ${JSON.stringify(v)}`).join("  "):"";
  const ms=phase.data?.ms!=null?` +${phase.data.ms}ms`:"";
  return h("div",{style:{
    display:"flex",alignItems:"flex-start",gap:10,padding:"6px 0",
    borderBottom:i>0?`1px solid ${T.border}22`:"none",
  }},
    h("span",{style:{width:24,flexShrink:0,textAlign:"center"}},icon),
    h("div",{style:{flex:1,minWidth:0}},
      h("span",{style:{fontSize:12,fontWeight:600,color:T.text}},phase.name),
      ms&&h("span",{style:{fontSize:10,color:T.muted,marginRight:6}},ms),
      dataStr&&h("div",{style:{fontSize:10,color:T.muted,marginTop:2,wordBreak:"break-word"}},dataStr)
    )
  );
}

// ── Heatmap (hour × day-of-week) ───────────────────────────────
function Heatmap({data}){
  if(!data) return h(Card,null,h(Sk,{h:240}));
  const days=["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];
  const max=data.max||1;
  const cellColor=(v)=>{
    if(!v) return T.dim;
    const intensity=v/max;
    // gold gradient
    const alpha=Math.max(0.15,intensity);
    return `rgba(212,168,67,${alpha.toFixed(2)})`;
  };
  return h(Card,null,
    h(SH,{icon:"🔥",title:"خريطة النشاط — يوم الأسبوع × ساعة (UTC)"}),
    h("div",{style:{overflowX:"auto"}},
      h("table",{style:{borderSpacing:2,borderCollapse:"separate",fontSize:10}},
        h("thead",null,h("tr",null,
          h("th",{style:{padding:"4px 6px",color:T.muted,fontWeight:500}}," "),
          ...Array.from({length:24},(_,h2)=>h("th",{key:h2,style:{padding:"4px 2px",color:T.muted,fontSize:9,fontWeight:500,textAlign:"center",minWidth:18}},h2))
        )),
        h("tbody",null,days.map((dn,d)=>
          h("tr",{key:d},
            h("td",{style:{padding:"3px 8px",color:T.muted,fontWeight:500,whiteSpace:"nowrap",fontSize:11}},dn),
            ...Array.from({length:24},(_,h2)=>{
              const v=data.matrix?.[d]?.[h2]||0;
              return h("td",{key:h2,title:`${dn} ${h2}:00 → ${v} بحث`,style:{
                background:cellColor(v),width:18,height:22,borderRadius:3,
                textAlign:"center",color:v>max*0.5?T.bg:T.muted,fontSize:9,fontWeight:600,cursor:"default"
              }},v||"")
            })
          )
        ))
      )
    ),
    h("div",{style:{display:"flex",alignItems:"center",gap:8,marginTop:10,fontSize:11,color:T.muted,justifyContent:"flex-end"}},
      h("span",null,"أقل"),
      ...[0.15,0.35,0.55,0.75,1].map((a,i)=>h("span",{key:i,style:{width:18,height:14,background:`rgba(212,168,67,${a})`,borderRadius:2}})),
      h("span",null,"أكثر")
    )
  );
}

                  h(Tooltip,{content:h(CT)}),
                  h(Area,{type:"monotone",dataKey:"searches",name:"بحث",stroke:T.blue,fill:T.blue+"33",strokeWidth:2}),
                  h(Area,{type:"monotone",dataKey:"downloads",name:"تحميل",stroke:T.gold,fill:T.gold+"33",strokeWidth:2})
                )
              )
            )
          ),
          // Quick actions
          h("div",{style:{display:"flex",gap:8,flexWrap:"wrap",marginBottom:18,paddingBottom:14,borderBottom:`1px solid ${T.border}`}},
            h(Btn,{variant:data.premium?"ghost":"gold",onClick:()=>onAction(data.premium?"revokePrem":"grantPrem",u.telegramId)},
              data.premium?"❌ إلغاء التميز":"⭐ منح تميز"),
            h(Btn,{variant:data.banned?"success":"danger",onClick:()=>onAction(data.banned?"unban":"ban",u.telegramId)},
              data.banned?"✅ رفع الحظر":"🚫 حظر")
          ),
          // Recent searches
          h("div",null,
            h("div",{style:{fontSize:12,color:T.muted,marginBottom:8,fontWeight:600,display:"flex",justifyContent:"space-between",alignItems:"center"}},
              h("span",null,`آخر ${(data.recentSearches||[]).length} بحث`),
              data.recentSearches?.length>0&&h(Btn,{variant:"ghost",onClick:()=>exportCSV(`user-${u.telegramId}-searches`,data.recentSearches,[
                {key:"createdAt",label:"الوقت"},
                {key:"query",label:"الاستعلام"},
                {key:"bookFound",label:"وُجد"},
                {key:"pdfSent",label:"اتسلّم"},
                {key:"resultCount",label:"عدد النتائج"},
              ])},"📥 CSV")
            ),
            h("div",{style:{maxHeight:280,overflowY:"auto",border:`1px solid ${T.border}`,borderRadius:8}},
              h("table",{style:{width:"100%"}},
                h("tbody",null,(data.recentSearches||[]).map((s,i)=>{
                  const ago=s.createdAt?Math.floor((Date.now()-new Date(s.createdAt).getTime())/60000):0;
                  const agoStr=ago<60?`${ago}د`:ago<1440?`${Math.floor(ago/60)}س`:`${Math.floor(ago/1440)}ي`;
                  return h("tr",{key:s.id||i,style:{borderBottom:`1px solid ${T.border}30`}},
                    h("td",{className:"mono",style:{color:T.muted,fontSize:10,padding:"6px 10px",whiteSpace:"nowrap"}},agoStr),
                    h("td",{style:{fontSize:12,padding:"6px 4px",color:T.text,maxWidth:300,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},s.query),
                    h("td",{style:{padding:"6px 10px",textAlign:"left"}},
                      s.pdfSent?h("span",{style:{color:T.gold,fontSize:11}},"📥"):
                      s.bookFound?h("span",{style:{color:T.green,fontSize:11}},"✅"):
                      h("span",{style:{color:T.red,fontSize:11}},"❌"))
                  );
                }))
              )
            )
          )
        );
      })()
    )
  );
}

function App(){
  const [tab,setTab]=useState("overview");
  const [ov,setOv]=useState(null);
  const [books,setBooks]=useState([]);
  const [sources,setSources]=useState([]);
  const [dlq,setDlq]=useState([]);
  const [prem,setPrem]=useState([]);
  const [banned,setBanned]=useState([]);
  const [allUsers,setAllUsers]=useState(null);   // {users:[],total:0}
  const [cacheBooks,setCacheBooks]=useState(null);
  const [recent,setRecent]=useState(null);
  const [failed,setFailed]=useState(null);
  const [heatmap,setHeatmap]=useState(null);
  const [drillId,setDrillId]=useState(null);
  const [ts,setTs]=useState(Date.now());
  const [toast,setToast]=useState(null);
  const [sidebar,setSidebar]=useState(true);
  const [funnel,setFunnel]=useState(null);
  const [traces,setTraces]=useState([]);
  const [isMock,setIsMock]=useState(false);
  const [ago,setAgo]=useState("الآن");

  const showToast=(msg,type="ok")=>setToast({msg,type});

  // tab ref للـ lazy load داخل useCallback
  const tabRef=useRef("overview");
  useEffect(()=>{tabRef.current=tab;},[tab]);

  const loadAll=useCallback(async()=>{
    // ── Core data (دائماً) ───────────────────
    const [r1,r2,r3,r4,r5,r6]=await Promise.allSettled([
      loadOv(),loadBooks(),loadSrc(),loadDLQ(),loadPrem(),loadBanned()
    ]);
    if(r1.status==="fulfilled")setOv(r1.value);
    if(r2.status==="fulfilled")setBooks(r2.value);
    if(r3.status==="fulfilled")setSources(r3.value);
    if(r4.status==="fulfilled")setDlq(r4.value);
    if(r5.status==="fulfilled")setPrem(r5.value);
    if(r6.status==="fulfilled")setBanned(r6.value);

    // ── Telemetry: فقط لما tab مفتوح ────────
    if(tabRef.current==="telemetry"){
      const [rt,rf]=await Promise.allSettled([loadTraces(),loadFunnel()]);
      if(rt.status==="fulfilled")setTraces(rt.value);
      if(rf.status==="fulfilled")setFunnel(rf.value);
    }

    // ── All users: فقط لما users tab مفتوح ──
    if(tabRef.current==="users"){
      const r=await apiFetch("users/all?limit=200").catch(()=>null);
      if(r)setAllUsers(r);
    }

    // ── Cached books: فقط لما cache tab مفتوح ──
    if(tabRef.current==="cache"){
      const r=await apiFetch("db/cached-books?limit=300").catch(()=>null);
      if(r)setCacheBooks(r);
    }

    // ── Recent searches: فقط لما recent tab مفتوح ──
    if(tabRef.current==="recent"){
      const r=await apiFetch("db/recent-searches?limit=100").catch(()=>null);
      if(r)setRecent(r);
    }

    setIsMock(_mock);
    setTs(Date.now());
  },[]);

  // لما يفتح telemetry tab لأول مرة، اجلب البيانات فوراً
  const prevTabRef=useRef("overview");
  useEffect(()=>{
    if(tab==="telemetry"&&prevTabRef.current!=="telemetry"){
      Promise.allSettled([loadTraces(),loadFunnel()]).then(([rt,rf])=>{
        if(rt.status==="fulfilled")setTraces(rt.value);
        if(rf.status==="fulfilled")setFunnel(rf.value);
      });
    }
    // لما يفتح users tab لأول مرة، اجلب كل المستخدمين فوراً
    if(tab==="users"&&prevTabRef.current!=="users"){
      apiFetch("users/all?limit=200").then(r=>{if(r)setAllUsers(r);}).catch(()=>{});
    }
    if(tab==="cache"&&prevTabRef.current!=="cache"){
      apiFetch("db/cached-books?limit=300").then(r=>{if(r)setCacheBooks(r);}).catch(()=>{});
    }
    if(tab==="recent"&&prevTabRef.current!=="recent"){
      apiFetch("db/recent-searches?limit=100").then(r=>{if(r)setRecent(r);}).catch(()=>{});
    }
    if(tab==="failed"&&prevTabRef.current!=="failed"){
      apiFetch("db/failed-searches?limit=200").then(r=>{if(r)setFailed(r);}).catch(()=>{});
    }
    if(tab==="analytics"&&prevTabRef.current!=="analytics"&&!heatmap){
      apiFetch("db/hourly-heatmap").then(r=>{if(r)setHeatmap(r);}).catch(()=>{});
    }
    prevTabRef.current=tab;
  },[tab]);

  useEffect(()=>{
    loadAll();
    const t=setInterval(loadAll,REFRESH);
    return()=>clearInterval(t);
  },[loadAll]);

  useEffect(()=>{
    const t=setInterval(()=>{
      const s=Math.floor((Date.now()-ts)/1000);
      setAgo(s<5?"الآن":s<60?`${s}ث`:`${Math.floor(s/60)}د`);
    },1000);
    return()=>clearInterval(t);
  },[ts]);

  const maintenance=ov?.system?.maintenance;

  const handleToggleMaint=async()=>{
    await apiAct("PUT","maintenance",{active:!maintenance});
    showToast(maintenance?"✅ إيقاف الصيانة":"🔴 الصيانة مفعّلة",maintenance?"ok":"warn");
    loadAll();
  };
  const handleClearBL=async()=>{
    if(!confirm("مسح Blacklist؟"))return;
    await apiAct("DELETE","blacklist");
    showToast("✅ تم مسح Blacklist");loadAll();
  };

  return h("div",{style:{display:"flex",minHeight:"100vh",background:T.bg}},
    // Sidebar
    h("div",{style:{width:sidebar?220:62,background:T.surface,borderLeft:`1px solid ${T.border}`,
      display:"flex",flexDirection:"column",transition:"width .25s cubic-bezier(.4,0,.2,1)",
      overflow:"hidden",flexShrink:0,position:"sticky",top:0,height:"100vh"}},
      h("div",{style:{padding:"18px 14px",borderBottom:`1px solid ${T.border}`,
        display:"flex",alignItems:"center",gap:10,overflow:"hidden"}},
        h("div",{className:"glow",style:{width:38,height:38,borderRadius:10,flexShrink:0,
          background:`linear-gradient(135deg,${T.goldDim},${T.gold})`,
          display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}},"📚"),
        sidebar&&h("div",{style:{overflow:"hidden",lineHeight:1.3}},
          h("div",{style:{color:T.gold,fontWeight:800,fontSize:13,whiteSpace:"nowrap"}},"خلاصة الكتب"),
          h("div",{style:{color:T.muted,fontSize:10,whiteSpace:"nowrap"}},"لوحة الإدارة")
        )
      ),
      h("nav",{style:{flex:1,padding:"10px 8px",display:"flex",flexDirection:"column",gap:2,overflowY:"auto"}},
        TABS.map(t=>h("button",{key:t.id,onClick:()=>setTab(t.id),style:{
          background:tab===t.id?T.goldDim+"30":"transparent",
          border:`1px solid ${tab===t.id?T.gold+"55":"transparent"}`,
          color:tab===t.id?T.gold:T.muted,
          padding:"9px 10px",borderRadius:9,display:"flex",alignItems:"center",
          gap:9,transition:"all .15s",textAlign:"right",width:"100%"}},
          h("span",{style:{fontSize:17,flexShrink:0}},t.icon),
          sidebar&&h("span",{style:{fontSize:13,fontWeight:tab===t.id?600:400,whiteSpace:"nowrap"}},t.label)
        ))
      ),
      h("button",{onClick:()=>setSidebar(p=>!p),style:{background:"transparent",border:"none",color:T.muted,padding:14,borderTop:`1px solid ${T.border}`,fontSize:14}},sidebar?"◀":"▶")
    ),
    // Main
    h("div",{style:{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}},
      // Topbar
      h("div",{style:{background:T.surface,borderBottom:`1px solid ${T.border}`,
        padding:"0 20px",height:56,display:"flex",alignItems:"center",
        justifyContent:"space-between",flexShrink:0,position:"sticky",top:0,zIndex:100}},
        h("div",{style:{display:"flex",alignItems:"center",gap:10}},
          h("span",{style:{fontSize:17,fontWeight:800}},
            TABS.find(t=>t.id===tab)?.icon," ",TABS.find(t=>t.id===tab)?.label),
          maintenance&&h(Tag,{color:T.red},"🔴 صيانة"),
          isMock&&h(Tag,{color:T.orange},"🟡 بيانات تجريبية")
        ),
        h("div",{style:{display:"flex",alignItems:"center",gap:10}},
          !isMock&&h(Tag,{color:T.green,size:11},"🟢 متصل"),
          h("div",{style:{display:"flex",alignItems:"center",gap:5,fontSize:11,color:T.muted}},
            h(Dot)," ",ago),
          h(Btn,{variant:"gold",size:"sm",onClick:loadAll},"🔄"),
          h("div",{style:{background:T.goldDim+"30",border:`1px solid ${T.goldDim}`,
            color:T.gold,padding:"4px 10px",borderRadius:8,fontSize:11,fontWeight:600}},"🛡️ أدمن")
        )
      ),
      // Content
      h("div",{style:{flex:1,overflowY:"auto",padding:"22px 18px"}},
        tab==="overview"  &&h(OverviewTab,{ov}),
        tab==="analytics" &&h(AnalyticsTab,{weekly:ov?.weekly||[],heatmap}),
        tab==="books"     &&h(BooksTab,{books}),
        tab==="failed"    &&h(FailedTab,{failed}),
        tab==="cache"     &&h(CacheTab,{books:cacheBooks}),
        tab==="recent"    &&h(RecentTab,{searches:recent}),
        tab==="sources"   &&h(SourcesTab,{sources}),
        tab==="queue"     &&h(QueueTab,{queue:ov?.queue,dlq,onToast:showToast,onRefresh:loadAll}),
        tab==="users"     &&h(UsersTab,{prem,banned,allUsers,onToast:showToast,onRefresh:loadAll,onUserClick:setDrillId}),
        tab==="system"    &&h(SystemTab,{system:ov?.system,maintenance,onToggleMaint:handleToggleMaint,onClearBL:handleClearBL}),
        tab==="telemetry" &&h(TelemetryTab,{funnel,traces})
      )
    ),
    toast&&h(Toast,{msg:toast.msg,type:toast.type,onDone:()=>setToast(null)}),
    drillId&&h(UserModal,{userId:drillId,onClose:()=>setDrillId(null),onAction:async(type,id2)=>{
      const m={
        grantPrem:()=>apiAct("POST",`users/${id2}/premium`,{enable:true}),
        revokePrem:()=>apiAct("POST",`users/${id2}/premium`,{enable:false}),
        ban:()=>apiAct("POST",`users/${id2}/ban`),
        unban:()=>apiAct("DELETE",`users/${id2}/ban`),
      };
      try{ await m[type]?.(); }catch(e){}
      const msgs={grantPrem:"⭐ تم منح التميز",revokePrem:"❌ تم إلغاء التميز",ban:"🚫 تم الحظر",unban:"✅ تم رفع الحظر"};
      showToast(msgs[type]||"تم");
      setDrillId(null);
      loadAll();
    }})
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
